  DÁN TOÀN BỘ TỆP NÀY VÀO index.html TRÊN GITHUB.
  KHÔNG DÁN VÀO GOOGLE APPS SCRIPT.
  Sau khi triển khai Apps Script, thay PASTE_APPS_SCRIPT_WEB_APP_URL_HERE bằng URL /exec.

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f8fc">
  <title>Đánh giá sản phẩm nhóm – Đa phòng</title>
  <style>
    :root{--ink:#18364d;--muted:#617789;--line:#d6e3ed;--bg:#f3f8fc;--card:#fff;--blue:#1877d2;--green:#078b78;--purple:#7656b5;--red:#c83b32;--self:#16804b;--selfbg:#e7f7ee;--peer:#c65b09;--peerbg:#fff1dd;--teacher:#1769c2;--teacherbg:#e7f1ff}
    *{box-sizing:border-box;min-width:0}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
    .shell{min-height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}body.in-room .shell{grid-template-rows:minmax(0,1fr)}body.in-room .topbar{display:none}
    .topbar{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(10px,2vw,26px);background:#fff;box-shadow:0 2px 13px #17324b18}
    .brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);cursor:pointer;text-align:left}.logo{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#1677d2,#08a38d);font-size:20px;font-weight:900}.brand b{display:block;font-size:clamp(15px,1.5vw,22px)}.brand span{display:block;color:var(--muted);font-size:11px}
    .top-actions{display:flex;align-items:center;gap:7px}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff;font-size:13px;font-weight:800;cursor:pointer}.pill.primary{border:0;color:#fff;background:var(--blue)}.pill.green{border:0;color:#fff;background:var(--green)}.pill.purple{border:0;color:#fff;background:var(--purple)}.pill.red{border:0;color:#fff;background:var(--red)}.pill:disabled{opacity:.5;cursor:not-allowed}
    main{min-height:0}.landing{width:min(1080px,94vw);margin:0 auto;padding:clamp(26px,6vw,76px) 0}.hero{text-align:center}.hero h1{margin:0;font-size:clamp(28px,4.8vw,58px);line-height:1.05}.hero p{max-width:760px;margin:15px auto 0;color:var(--muted);font-size:clamp(15px,1.6vw,20px);line-height:1.5}
    .entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:32px}.entry-card{padding:clamp(19px,3vw,32px);border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 12px 35px #234a6912}.entry-card h2{margin:0 0 7px}.entry-card p{min-height:42px;margin:0 0 18px;color:var(--muted);line-height:1.4}.room-entry{display:flex;gap:8px}.room-entry input{text-transform:uppercase;letter-spacing:4px;font-weight:900}
    .field{display:flex;flex-direction:column;gap:5px}.field label{color:var(--muted);font-size:12px;font-weight:800}.field input,.field select,.field textarea{width:100%;min-height:43px;padding:9px 11px;border:1px solid #bcd0df;border-radius:10px;color:var(--ink);background:#fff}.field textarea{min-height:80px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field.full{grid-column:1/-1}.note{padding:9px 11px;border-radius:9px;color:#315d80;background:#edf6ff;font-size:12px;line-height:1.4}.error-note{color:#a42a24;background:#fff0ee}.success-note{color:#126b40;background:#e9f8ef}
    .dashboard{width:min(1180px,96vw);margin:0 auto;padding:18px 0 30px}.dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.dash-head h1{margin:0;font-size:clamp(22px,3vw,34px)}.teacher-meta{color:var(--muted);font-size:13px}.room-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.room-card{display:flex;flex-direction:column;gap:9px;padding:15px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 5px 18px #193f5d0e}.room-card h3{margin:0;font-size:18px}.room-code{font-size:22px;font-weight:900;letter-spacing:3px;color:var(--blue)}.room-meta{color:var(--muted);font-size:12px}.status{display:inline-flex;align-self:flex-start;padding:4px 7px;border-radius:7px;font-size:10px;font-weight:900}.status.open{color:#087158;background:#ddf8ef}.status.closed{color:#a23b21;background:#fff0e8}.status.archived{color:#5d6371;background:#eceff3}
    .room-page{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.room-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:9px;padding:7px clamp(7px,1.5vw,18px)}.room-title h1{margin:0;font-size:clamp(16px,2vw,25px)}.room-title div{color:var(--muted);font-size:11px}.student-summary{display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap}.student-summary strong{font-size:clamp(13px,1.6vw,21px);color:var(--ink)}.student-chip{display:inline-flex;align-items:center;min-height:25px;padding:4px 7px;border-radius:8px;background:#e9f3fb;color:#315d80;font-size:10px;font-weight:800}.student-chip.good{color:#087158;background:#ddf8ef}.student-chip.warn{color:#a64b00;background:#fff0dc}.student-votes{overflow:hidden;text-overflow:ellipsis}.room-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.report-grid{display:grid;gap:clamp(5px,.8vw,11px);min-height:0;padding:4px clamp(5px,1vw,13px) 7px;overflow:hidden}.group-card{display:grid;grid-template-rows:minmax(65px,46%) minmax(0,54%);min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 4px 14px #1f446513}.cover{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden;background:#eaf2f8;cursor:pointer}.cover img{width:100%;height:100%;object-fit:contain}.cover-empty{padding:8px;color:#8093a1;font-size:clamp(11px,1vw,16px);font-weight:900;text-align:center}.file-badge{position:absolute;top:5px;left:5px;padding:3px 6px;border-radius:6px;color:#fff;background:#17324bcc;font-size:9px;font-weight:900}.open-product{position:absolute;right:5px;bottom:5px;padding:4px 6px;border:0;border-radius:6px;color:#fff;background:#087f6fe8;font-size:8px;font-weight:900;cursor:pointer}
    .group-info{display:flex;flex-direction:column;min-height:0;padding:clamp(5px,.7vw,9px);overflow:hidden}.group-row{display:flex;align-items:center;justify-content:space-between;gap:6px}.group-name{font-size:clamp(13px,1.25vw,20px);font-weight:900}.total{padding:4px 7px;border:0;border-radius:8px;color:#fff;background:linear-gradient(135deg,#e75a2d,#c93e1c);font-size:clamp(8px,.75vw,11px);font-weight:900;cursor:pointer}.product-note{margin:2px 0 4px;overflow:hidden;color:var(--muted);font-size:clamp(9px,.8vw,12px);white-space:nowrap;text-overflow:ellipsis}.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:auto}.score{padding:4px 2px;border-radius:7px;text-align:center;font-size:clamp(8px,.7vw,11px);overflow-wrap:anywhere}.score span,.score b{display:block}.score b{margin-top:2px;font-size:1.2em}.self{color:var(--self);background:var(--selfbg)}.peer{border:0;color:var(--peer);background:var(--peerbg);cursor:pointer}.teacher{color:var(--teacher);background:var(--teacherbg)}.pager{display:none;align-items:center;justify-content:center;gap:9px;padding:2px 8px 7px}.pager.show{display:flex}.pager button{min-width:38px;min-height:29px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:900}.pager span{font-size:11px;font-weight:800;color:var(--muted)}
    .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:11px;background:#06121deb}.modal.show{display:flex}.dialog{position:relative;width:min(92vw,720px);max-height:92dvh;overflow:auto;padding:20px;border-radius:17px;background:#fff}.dialog.wide{width:min(95vw,980px)}.dialog h2{margin:0 40px 13px 0}.close{position:absolute;top:7px;right:10px;width:39px;height:39px;border:0;background:transparent;color:#6b7e8d;font-size:34px;cursor:pointer}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.message{min-height:18px;margin:8px 0;color:var(--muted);font-size:13px;font-weight:800;white-space:pre-line}.message.error{color:#b42318}.message.success{color:#14804a}.pin-table{width:100%;border-collapse:collapse}.pin-table th,.pin-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.pin-value{font-size:18px;font-weight:900;letter-spacing:3px}.pin-panel{display:none}.pin-panel.show{display:block}.room-code-large{margin:5px 0;font-size:clamp(28px,5vw,46px);font-weight:900;letter-spacing:6px;color:var(--blue)}.qr-wrap{display:flex;align-items:center;gap:18px;margin-top:15px;padding:12px;border-radius:12px;background:#f0f7fb}.qr-wrap img{width:150px;height:150px;background:#fff}.url-box{overflow-wrap:anywhere;color:var(--blue);font-size:12px}.confirm-box{grid-column:1/-1;padding:12px;border:2px solid #f1b868;border-radius:11px;color:#7c4300;background:#fff8e9}.confirm-box p{margin:0 0 9px;font-weight:800}.confirm-actions{display:flex;gap:8px}.group-gate{width:min(680px,94vw);margin:clamp(25px,7vh,80px) auto;padding:clamp(18px,4vw,34px);border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 14px 38px #193f5d18}.group-gate h1{margin:0 0 7px}.group-gate p{color:var(--muted)}.device-list{display:grid;gap:8px}.device-row{display:grid;grid-template-columns:minmax(110px,1fr) minmax(100px,1fr) auto;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:11px}.device-row.pending{border-color:#f1b868;background:#fff9ed}.device-row.approved{border-color:#8ed8c4;background:#edfbf6}.device-actions{display:flex;gap:5px}.viewer{display:grid;place-items:center;width:100%;height:100%}.viewer img{max-width:94vw;max-height:80dvh;object-fit:contain;transform-origin:center}.viewer-tools{display:flex;gap:8px;margin-top:8px}.toast{position:fixed;left:50%;bottom:18px;z-index:200;transform:translateX(-50%);display:none;max-width:90vw;padding:11px 16px;border-radius:10px;color:#fff;background:#17324beF;font-size:13px;font-weight:800}.toast.show{display:block}
    @media(max-width:760px){.brand span{display:none}.topbar{padding:7px}.top-actions .pill{padding:6px 8px;font-size:10px}.entry-grid{grid-template-columns:1fr}.entry-card p{min-height:0}.room-list{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.room-toolbar{gap:4px;padding:5px}.room-title h1{font-size:12px}.student-summary{gap:3px}.student-summary strong{font-size:11px}.student-chip{min-height:22px;padding:3px 4px;font-size:8px}.student-votes{max-width:26vw}.room-buttons{gap:3px;flex-wrap:wrap}.room-buttons .pill{min-height:30px;padding:4px 6px;font-size:8px;white-space:nowrap}.report-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(3,minmax(0,1fr))!important}.group-card{grid-template-rows:minmax(48px,43%) minmax(0,57%);border-radius:9px}.group-info{padding:4px}.group-name{font-size:12px}.total{padding:3px 4px;font-size:7px}.product-note{font-size:8px}.score{padding:3px 1px;font-size:7px}.score b{font-size:10px}.file-badge,.open-product{font-size:7px;padding:3px 4px}.dialog-actions{flex-direction:column}.dialog-actions .pill{width:100%}.qr-wrap{flex-direction:column;text-align:center}.confirm-actions .pill{flex:1}.device-row{grid-template-columns:1fr}.device-actions .pill{flex:1}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" id="homeButton"><span class="logo">ĐG</span><span><b>ĐÁNH GIÁ SẢN PHẨM NHÓM</b><span>Một hệ thống – nhiều giáo viên – nhiều phòng học</span></span></button>
      <div class="top-actions"><button class="pill" id="joinButton">VÀO PHÒNG</button><button class="pill primary" id="teacherButton">GIÁO VIÊN</button></div>
    </header>
    <main id="app"></main>
  </div>
  <div id="modal" class="modal"><div id="dialog" class="dialog"><button class="close" id="closeModal">×</button><div id="dialogBody"></div></div></div>
  <div id="toast" class="toast"></div>

  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbwQtb1PoALXcmKAw6i3yLJRRh829G_5z3O8y6tPlcwFGyhaLyAj1sSckwlkWgoN2x5h2w/exec';
    const PAGE_SIZE=6;
    const state={teacher:null,credentials:null,rooms:[],room:null,groups:[],products:[],scores:[],teacherMode:false,studentGroup:null,deviceRequest:null,deviceToken:'',page:0,poll:null,rotation:0};
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const fmt=value=>value===null||value===undefined?'—':Number(value).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2});
    const roomUrl=roomId=>location.origin+location.pathname+'?room='+encodeURIComponent(roomId);

    async function api(payload){
      if(API_URL.includes('PASTE_'))throw new Error('Chưa điền URL Apps Script vào index.html.');
      const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      const raw=await response.text();let data;
      try{data=JSON.parse(raw)}catch{throw new Error('Apps Script chưa được triển khai thành phiên bản mới hoặc quyền truy cập chưa đúng.');}
      if(!data.ok)throw new Error(data.message||'Máy chủ từ chối yêu cầu.');return data;
    }
    function auth(){return state.credentials?{teacherEmail:state.credentials.email,teacherPin:state.credentials.pin}:{}}
    function toast(message){const box=$('toast');box.textContent=message;box.classList.add('show');setTimeout(()=>box.classList.remove('show'),2500)}
    function showModal(html,wide=false){$('dialogBody').innerHTML=html;$('dialog').classList.toggle('wide',wide);$('modal').classList.add('show')}
    function closeModal(){if($('dialogBody').querySelector('.viewer'))return normalClose();normalClose()}
    function normalClose(){$('modal').classList.remove('show');$('dialogBody').replaceChildren();$('dialog').classList.remove('wide')}
    function setMessage(message,error=false){const box=$('formMessage');if(box){box.textContent=message;box.className='message '+(error?'error':'success')}}
    function clearPoll(){if(state.poll){clearInterval(state.poll);state.poll=null}}

    function renderLanding(){clearPoll();document.body.classList.remove('in-room');state.room=null;state.teacherMode=false;state.studentGroup=null;state.deviceRequest=null;state.deviceToken='';history.replaceState({},'',location.pathname);$('app').innerHTML=`
      <section class="landing"><div class="hero"><h1>Mỗi tiết học là một phòng đánh giá riêng</h1><p>Học sinh nộp sản phẩm, tự chấm, chấm chéo và xem kết quả trên cùng một màn hình. Dữ liệu giữa các giáo viên và lớp học được tách hoàn toàn bằng mã phòng.</p></div>
      <div class="entry-grid"><article class="entry-card"><h2>🎓 Học sinh</h2><p>Nhập mã phòng 6 ký tự hoặc quét QR do giáo viên cung cấp.</p><div class="room-entry"><input id="roomInput" maxlength="6" placeholder="VD: A7K3P2"><button class="pill green" id="enterRoom">VÀO PHÒNG</button></div></article>
      <article class="entry-card"><h2>👩‍🏫 Giáo viên</h2><p>Đăng nhập để tạo phòng, nhận mã nhóm và quản lý các buổi đánh giá.</p><button class="pill primary" id="openTeacher">ĐĂNG NHẬP GIÁO VIÊN</button> <button class="pill" id="openRegister">ĐĂNG KÝ</button></article></div></section>`;
      $('enterRoom').onclick=()=>openRoom($('roomInput').value,false);$('openTeacher').onclick=openTeacherLogin;$('openRegister').onclick=openTeacherRegister;
    }

    function openJoin(){showModal(`<h2>Vào phòng học</h2><div class="field"><label>Mã phòng 6 ký tự</label><input id="joinCode" maxlength="6" placeholder="A7K3P2" style="text-transform:uppercase;letter-spacing:4px;font-weight:900"></div><div id="formMessage" class="message"></div><div class="dialog-actions"><button class="pill green" id="joinNow">VÀO PHÒNG</button></div>`);$('joinNow').onclick=()=>{const code=$('joinCode').value;normalClose();openRoom(code,false)}}

    function openTeacherLogin(){showModal(`<h2>Đăng nhập giáo viên</h2><form id="teacherLogin" class="form-grid"><div class="field full"><label>Email</label><input name="email" type="email" required></div><div class="field full"><label>PIN giáo viên (6 số)</label><input name="pin" type="password" inputmode="numeric" maxlength="6" required></div><div id="formMessage" class="message field full"></div><div class="field full"><button class="pill primary" type="submit">ĐĂNG NHẬP</button></div></form><p class="note">Chưa có tài khoản? Đóng cửa sổ và chọn ĐĂNG KÝ bằng mã mời của quản trị viên.</p>`);$('teacherLogin').onsubmit=loginTeacher}
    async function loginTeacher(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');button.disabled=true;try{setMessage('Đang đăng nhập...');const values=Object.fromEntries(new FormData(form)),data=await api({action:'loginTeacher',email:values.email,pin:values.pin});state.teacher=data.teacher;state.credentials={email:values.email.trim().toLowerCase(),pin:values.pin};state.rooms=data.rooms||[];sessionStorage.setItem('mrTeacher',JSON.stringify(state.credentials));normalClose();renderDashboard()}catch(e){setMessage(e.message,true)}finally{button.disabled=false}}

    function openTeacherRegister(){showModal(`<h2>Đăng ký giáo viên</h2><form id="teacherRegister" class="form-grid"><div class="field full"><label>Họ và tên</label><input name="name" required></div><div class="field full"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Tạo PIN 6 số</label><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="field"><label>Mã mời giáo viên</label><input name="inviteCode" inputmode="numeric" maxlength="6" required></div><div id="formMessage" class="message field full"></div><div class="field full"><button class="pill primary" type="submit">TẠO TÀI KHOẢN</button></div></form>`);$('teacherRegister').onsubmit=registerTeacher}
    async function registerTeacher(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');button.disabled=true;try{setMessage('Đang tạo tài khoản...');const values=Object.fromEntries(new FormData(form)),data=await api({action:'registerTeacher',...values});state.teacher=data.teacher;state.credentials={email:values.email.trim().toLowerCase(),pin:values.pin};sessionStorage.setItem('mrTeacher',JSON.stringify(state.credentials));const rooms=await api({action:'listRooms',...auth()});state.rooms=rooms.rooms||[];normalClose();renderDashboard();toast(data.message)}catch(e){setMessage(e.message,true)}finally{button.disabled=false}}

    function renderDashboard(){clearPoll();document.body.classList.remove('in-room');history.replaceState({},'',location.pathname);const rooms=state.rooms.map(room=>`<article class="room-card"><div class="status ${room.status.toLowerCase()}">${statusText(room.status)}</div><div class="room-code">${esc(room.roomId)}</div><h3>${esc(room.title)}</h3><div class="room-meta">${esc(room.className||'Chưa ghi lớp')} • ${room.groupCount} nhóm • ${room.selfWeight}/${room.peerWeight}/${room.teacherWeight}</div><button class="pill primary open-room" data-room="${esc(room.roomId)}">MỞ PHÒNG</button></article>`).join('')||'<div class="note">Chưa có phòng học. Hãy tạo phòng đầu tiên.</div>';
      $('app').innerHTML=`<section class="dashboard"><div class="dash-head"><div><h1>Phòng học của ${esc(state.teacher.name)}</h1><div class="teacher-meta">${esc(state.teacher.email)}</div></div><div><button class="pill purple" id="adminPanel">QUẢN TRỊ</button> <button class="pill green" id="createRoom">+ TẠO PHÒNG</button> <button class="pill" id="logout">ĐĂNG XUẤT</button></div></div><div class="room-list">${rooms}</div></section>`;
      $('createRoom').onclick=openCreateRoom;$('adminPanel').onclick=openAdminPanel;$('logout').onclick=()=>{sessionStorage.removeItem('mrTeacher');state.teacher=null;state.credentials=null;renderLanding()};document.querySelectorAll('.open-room').forEach(button=>button.onclick=()=>openRoom(button.dataset.room,true));
    }
    function statusText(status){return status==='OPEN'?'ĐANG MỞ':status==='CLOSED'?'ĐÃ KHÓA':'LƯU TRỮ'}

    function openCreateRoom(){showModal(`<h2>Tạo phòng đánh giá</h2><form id="createRoomForm" class="form-grid"><div class="field full"><label>Tên buổi học/hoạt động</label><input name="title" placeholder="Đánh giá sản phẩm STEM" required></div><div class="field"><label>Lớp</label><input name="className" placeholder="11A1"></div><div class="field"><label>Số nhóm (2–12)</label><input name="groupCount" id="groupCount" type="number" min="2" max="12" value="6" required></div><div class="field"><label>Tự chấm %</label><input name="selfWeight" type="number" value="20" min="0" max="100"></div><div class="field"><label>Chấm chéo %</label><input name="peerWeight" type="number" value="30" min="0" max="100"></div><div class="field"><label>Giáo viên %</label><input name="teacherWeight" type="number" value="50" min="0" max="100"></div><div class="field full"><label>Tên các nhóm (mỗi dòng một tên, có thể để trống)</label><textarea name="groupNames" placeholder="Nhóm 1&#10;Nhóm 2&#10;Nhóm 3"></textarea></div><div id="formMessage" class="message field full"></div><div class="field full"><button class="pill green" type="submit">TẠO PHÒNG VÀ SINH MÃ</button></div></form>`,true);$('createRoomForm').onsubmit=createRoom}
    async function createRoom(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');button.disabled=true;try{setMessage('Đang tạo phòng...');const v=Object.fromEntries(new FormData(form)),count=Number(v.groupCount),names=String(v.groupNames||'').split(/\r?\n/).slice(0,count);const data=await api({action:'createRoom',...auth(),title:v.title,className:v.className,groupCount:count,selfWeight:Number(v.selfWeight),peerWeight:Number(v.peerWeight),teacherWeight:Number(v.teacherWeight),groupNames:names});showRoomCredentials(data);const list=await api({action:'listRooms',...auth()});state.rooms=list.rooms||[]}catch(e){setMessage(e.message,true)}finally{button.disabled=false}}
    function showRoomCredentials(data){renderRoomShare(data.roomId,true)}
    function renderRoomShare(roomId,created=false){const url=roomUrl(roomId);$('dialogBody').innerHTML=`<h2>${created?'Phòng đã sẵn sàng':'QR và mã vào phòng'}</h2><div class="qr-wrap"><img alt="QR phòng" src="https://quickchart.io/qr?size=220&text=${encodeURIComponent(url)}"><div><b>MÃ PHÒNG</b><div class="room-code-large">${esc(roomId)}</div><div class="url-box">${esc(url)}</div><p><button class="pill" id="copyRoomLink">SAO CHÉP LINK</button> ${created?'<button class="pill primary" id="openCreatedRoom">MỞ PHÒNG</button>':''}</p></div></div><div class="note">Học sinh quét QR hoặc nhập mã phòng, chọn nhóm rồi chờ giáo viên duyệt thiết bị. Không sử dụng PIN nhóm.</div>`;$('copyRoomLink').onclick=()=>navigator.clipboard.writeText(url).then(()=>toast('Đã sao chép liên kết'));if(created)$('openCreatedRoom').onclick=()=>{normalClose();openRoom(roomId,true)}}

    async function openRoom(roomId,teacherMode){const code=String(roomId||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){toast('Mã phòng phải gồm 6 ký tự.');return}try{clearPoll();document.body.classList.add('in-room');$('app').innerHTML='<section class="landing"><div class="note">Đang tải phòng '+esc(code)+'...</div></section>';const data=await api({action:'getRoom',roomId:code});state.room=data.room;state.groups=data.groups;state.products=data.products;state.scores=data.scores;state.teacherMode=Boolean(teacherMode&&state.teacher);state.studentGroup=null;state.deviceRequest=null;state.deviceToken='';state.page=0;history.replaceState({},'',location.pathname+'?room='+encodeURIComponent(code));if(state.teacherMode){renderRoom();startRoomPoll();return}const saved=readDeviceSession(code);if(saved){state.deviceRequest=saved;const checked=await checkSavedDevice(false);if(checked)return}renderGroupGate()}catch(e){renderLanding();toast(e.message)}}
    function startRoomPoll(){clearPoll();state.poll=setInterval(refreshRoom,5000)}
    function deviceSessionKey(roomId){return'mrDeviceSession:'+roomId}
    function readDeviceSession(roomId){try{return JSON.parse(localStorage.getItem(deviceSessionKey(roomId))||'null')}catch{return null}}
    function browserDeviceId(){let id=localStorage.getItem('mrBrowserDeviceId');if(!id){id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).replace(/-/g,'');localStorage.setItem('mrBrowserDeviceId',id)}return id}
    function renderGroupGate(){$('app').innerHTML=`<section class="group-gate"><h1>${esc(state.room.title)}</h1><p>${esc(state.room.className)} • Phòng <b>${esc(state.room.roomId)}</b></p><div class="note">Chọn đúng nhóm của em rồi gửi yêu cầu. Thiết bị chỉ được nộp sản phẩm và chấm điểm sau khi giáo viên duyệt.</div><form id="joinGroupForm" class="form-grid" style="margin-top:14px"><div class="field full"><label>Nhóm của em</label><select name="groupId">${groupOptions()}</select></div><div id="formMessage" class="message field full"></div><div class="field full"><button class="pill green" type="submit">XIN VÀO NHÓM</button></div></form></section>`;$('joinGroupForm').onsubmit=requestSelectedGroup}
    async function requestSelectedGroup(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),v=Object.fromEntries(new FormData(form)),group=state.groups.find(g=>g.groupId===v.groupId);if(!await confirmInForm(form,'Bạn xác nhận xin vào '+group.name+'?'))return;button.disabled=true;try{setMessage('Đang gửi yêu cầu...');const deviceId=browserDeviceId(),data=await api({action:'requestJoinGroup',roomId:state.room.roomId,groupId:v.groupId,deviceId,deviceName:'Thiết bị '+deviceId.slice(-4).toUpperCase()});state.deviceRequest={requestId:data.requestId,token:data.token,groupId:data.group.groupId};localStorage.setItem(deviceSessionKey(state.room.roomId),JSON.stringify(state.deviceRequest));renderWaitingApproval(data.group);startWaitingPoll()}catch(e){setMessage(e.message,true)}finally{button.disabled=false}}
    function renderWaitingApproval(group){$('app').innerHTML=`<section class="group-gate"><h1>Đang chờ giáo viên duyệt</h1><p>Yêu cầu vào <b>${esc(group.name)}</b> đã được gửi.</p><div class="note">Hãy giữ nguyên màn hình này. Khi giáo viên duyệt, hệ thống sẽ tự mở phòng.</div><div class="message" id="waitMessage">Đang kiểm tra trạng thái...</div><button class="pill" id="cancelRequest">CHỌN LẠI NHÓM</button></section>`;$('cancelRequest').onclick=cancelPendingRequest}
    async function cancelPendingRequest(){clearPoll();try{await api({action:'cancelJoinRequest',roomId:state.room.roomId,requestId:state.deviceRequest.requestId,token:state.deviceRequest.token})}catch(e){console.warn(e)}localStorage.removeItem(deviceSessionKey(state.room.roomId));state.deviceRequest=null;renderGroupGate()}
    function startWaitingPoll(){clearPoll();state.poll=setInterval(()=>checkSavedDevice(true),3000)}
    async function checkSavedDevice(fromPoll){if(!state.deviceRequest)return false;try{const data=await api({action:'checkJoinRequest',roomId:state.room.roomId,requestId:state.deviceRequest.requestId,token:state.deviceRequest.token});if(data.status==='APPROVED'){clearPoll();state.studentGroup=data.group;state.deviceToken=state.deviceRequest.token;renderRoom();startRoomPoll();toast('Giáo viên đã duyệt '+data.group.name+'.');return true}if(data.status==='PENDING'){if(!fromPoll)renderWaitingApproval(data.group);startWaitingPoll();return true}localStorage.removeItem(deviceSessionKey(state.room.roomId));state.deviceRequest=null;state.deviceToken='';if(fromPoll){clearPoll();renderGroupGate();toast(data.message)}return false}catch(e){localStorage.removeItem(deviceSessionKey(state.room.roomId));state.deviceRequest=null;state.deviceToken='';if(fromPoll){clearPoll();renderGroupGate();toast(e.message)}return false}}
    async function refreshRoom(){if(!state.room)return;try{if(!state.teacherMode&&state.deviceRequest){const status=await api({action:'checkJoinRequest',roomId:state.room.roomId,requestId:state.deviceRequest.requestId,token:state.deviceRequest.token});if(status.status!=='APPROVED'){localStorage.removeItem(deviceSessionKey(state.room.roomId));state.studentGroup=null;state.deviceToken='';clearPoll();renderGroupGate();toast(status.message);return}}const data=await api({action:'getRoom',roomId:state.room.roomId});state.room=data.room;state.groups=data.groups;state.products=data.products;state.scores=data.scores;if(state.teacherMode||state.studentGroup)renderRoom()}catch(e){console.warn(e)}}

    function calculate(){const result={};state.groups.forEach(g=>result[g.groupId]={self:[],peer:[],teacher:[],peerDetails:[]});state.scores.forEach(s=>{if(!result[s.targetId])return;const type=s.type.includes('Giáo viên')?'teacher':s.type.includes('Tự')?'self':'peer';result[s.targetId][type].push(Number(s.score));if(type==='peer')result[s.targetId].peerDetails.push(s)});Object.values(result).forEach(x=>{x.selfAvg=avg(x.self);x.peerAvg=avg(x.peer);x.teacherAvg=avg(x.teacher);x.complete=x.selfAvg!==null&&x.peerAvg!==null&&x.teacherAvg!==null;x.total=x.complete?(x.selfAvg*state.room.selfWeight+x.peerAvg*state.room.peerWeight+x.teacherAvg*state.room.teacherWeight)/100:null});return result}
    const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
    function renderRoom(){const result=calculate(),pageGroups=state.groups.slice(state.page*PAGE_SIZE,(state.page+1)*PAGE_SIZE),products=Object.fromEntries(state.products.map(p=>[p.groupId,p])),count=pageGroups.length,cols=count<=3?Math.max(1,count):count===4?2:3,rows=Math.ceil(count/cols),closed=state.room.status!=='OPEN';const cards=pageGroups.map(g=>groupCard(g,products[g.groupId],result[g.groupId])).join(''),title=state.teacherMode?`<div class="room-title"><h1>${esc(state.room.title)}</h1><div>${esc(state.room.className)} • Phòng <b>${esc(state.room.roomId)}</b> • ${statusText(state.room.status)}</div></div>`:studentHeader(result,products);$('app').innerHTML=`<section class="room-page"><div class="room-toolbar">${title}<div class="room-buttons">${state.teacherMode?`<button class="pill" id="showQR">QR & MÃ PHÒNG</button><button class="pill green" id="manageDevices">DUYỆT THIẾT BỊ</button><button class="pill primary" id="teacherScore">GV CHẤM</button><button class="pill purple" id="resetVote">CẤP LẠI LƯỢT</button><button class="pill ${closed?'green':'red'}" id="toggleRoom">${closed?'MỞ PHÒNG':'KHÓA PHÒNG'}</button><button class="pill" id="backDash">DANH SÁCH</button>`:`<button class="pill green" id="submitProduct" ${closed?'disabled':''}>NỘP SẢN PHẨM</button><button class="pill primary" id="studentScore" ${closed?'disabled':''}>CHẤM ĐIỂM</button>`}</div></div><div class="report-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr))">${cards}</div><div class="pager ${state.groups.length>PAGE_SIZE?'show':''}"><button id="prevPage">‹</button><span>Trang ${state.page+1}/${Math.ceil(state.groups.length/PAGE_SIZE)}</span><button id="nextPage">›</button></div></section>`;bindRoomButtons()}
    function studentHeader(result,products){const id=state.studentGroup.groupId,data=result[id],submitted=Boolean(products[id]),voted=state.scores.filter(s=>s.evaluatorId===id).map(s=>groupName(s.targetId));return `<div class="student-summary"><strong>${esc(state.studentGroup.name)}</strong><span class="student-chip">Điểm ${fmt(data.total)}</span><span class="student-chip ${submitted?'good':'warn'}">${submitted?'✓ Đã nộp':'Chưa nộp'}</span><span class="student-chip student-votes">Đã chấm: ${voted.length?esc(voted.join(', ')):'chưa có'}</span></div>`}
    function groupCard(group,product,data){const cover=product?.coverUrl?`<img src="${esc(product.coverUrl)}" alt="Sản phẩm ${esc(group.name)}">`:`<div class="cover-empty">${product?'🔗 SẢN PHẨM LIÊN KẾT':'CHƯA NỘP SẢN PHẨM'}</div>`,badge=product?`<span class="file-badge">${esc(product.type)}</span>`:'',open=product?.productUrl?`<button class="open-product" data-url="${esc(product.productUrl)}">XEM SẢN PHẨM</button>`:'';return `<article class="group-card"><div class="cover" data-image="${esc(product?.coverUrl||'')}">${cover}${badge}${open}</div><div class="group-info"><div class="group-row"><div class="group-name">${esc(group.name)}</div>${data.complete?`<button class="total" data-group="${esc(group.groupId)}">TẠM TÍNH ${fmt(data.total)}</button>`:''}</div><div class="product-note">${esc(product?.note||'Chưa có ghi chú')}</div><div class="scores"><div class="score self"><span>Tự chấm</span><b>${fmt(data.selfAvg)}</b></div><button class="score peer peer-detail" data-group="${esc(group.groupId)}"><span>Chấm chéo ${data.peer.length} lượt ⓘ</span><b>${fmt(data.peerAvg)}</b></button><div class="score teacher"><span>GV chấm</span><b>${fmt(data.teacherAvg)}</b></div></div></div></article>`}

    function bindRoomButtons(){document.querySelectorAll('.cover').forEach(box=>box.onclick=e=>{if(e.target.closest('.open-product'))return;const src=box.dataset.image;if(src)openImage(src)});document.querySelectorAll('.open-product').forEach(b=>b.onclick=e=>{e.stopPropagation();window.open(previewUrl(b.dataset.url),'_blank','noopener')});document.querySelectorAll('.peer-detail').forEach(b=>b.onclick=()=>openPeerDetails(b.dataset.group));document.querySelectorAll('.total').forEach(b=>b.onclick=()=>openTotal(b.dataset.group));const prev=$('prevPage'),next=$('nextPage');if(prev)prev.onclick=()=>{state.page=Math.max(0,state.page-1);renderRoom()};if(next)next.onclick=()=>{state.page=Math.min(Math.ceil(state.groups.length/PAGE_SIZE)-1,state.page+1);renderRoom()};if(state.teacherMode){$('showQR').onclick=showRoomQR;$('manageDevices').onclick=openDeviceManager;$('teacherScore').onclick=()=>openScoreForm(true);$('resetVote').onclick=openResetVote;$('toggleRoom').onclick=toggleRoom;$('backDash').onclick=async()=>{clearPoll();const data=await api({action:'listRooms',...auth()});state.rooms=data.rooms||[];renderDashboard()}}else{$('submitProduct').onclick=openProductForm;$('studentScore').onclick=()=>openScoreForm(false)}}
    function previewUrl(url){const value=String(url||''),id=value.match(/\/d\/([\w-]+)/)?.[1]||value.match(/[?&]id=([\w-]+)/)?.[1],yt=value.match(/(?:youtu\.be\/|watch\?v=)([\w-]+)/)?.[1];if(yt)return'https://www.youtube.com/embed/'+yt;if(id)return'https://drive.google.com/file/d/'+id+'/preview';return value}

    function groupOptions(includeTeacher=false){return state.groups.map(g=>`<option value="${esc(g.groupId)}">${esc(g.name)}</option>`).join('')+(includeTeacher?'<option value="TEACHER">Giáo viên</option>':'')}
    function studentTargetOptions(){const voted=new Set(state.scores.filter(s=>s.evaluatorId===state.studentGroup.groupId).map(s=>s.targetId));return state.groups.map(g=>`<option value="${esc(g.groupId)}" ${voted.has(g.groupId)?'disabled':''}>${esc(g.name)}${voted.has(g.groupId)?' — đã chấm':''}</option>`).join('')}
    function openProductForm(){showModal(`<h2>Nộp sản phẩm – ${esc(state.studentGroup.name)}</h2><form id="productForm" class="form-grid"><div class="note field full">Sản phẩm sẽ được ghi đúng cho <b>${esc(state.studentGroup.name)}</b>.</div><div class="field full"><label>Ảnh đại diện (tự nén trước khi gửi)</label><input name="image" type="file" accept="image/*"></div><div class="field full"><label>Liên kết PDF/PowerPoint/video (nếu có)</label><input name="productUrl" type="url" placeholder="https://..."></div><div class="field full"><label>Ghi chú</label><textarea name="note"></textarea></div><div id="formMessage" class="message field full"></div><div class="field full"><button class="pill green" type="submit">GỬI SẢN PHẨM</button></div></form>`);$('productForm').onsubmit=submitProduct}
    async function submitProduct(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),file=form.elements.image.files[0],v=Object.fromEntries(new FormData(form));if(!file&&!v.productUrl){setMessage('Hãy chọn ảnh hoặc dán liên kết sản phẩm.',true);return}if(!await confirmInForm(form,'Xác nhận gửi sản phẩm của '+state.studentGroup.name+'? Nếu nhóm đã nộp trước đó, sản phẩm mới sẽ thay sản phẩm cũ.'))return;button.disabled=true;button.textContent='ĐANG GỬI...';try{setMessage('Đang chuẩn bị ảnh...');const imageData=file?await compressImage(file):'';setMessage('Đang lưu sản phẩm...');const data=await api({action:'submitProduct',roomId:state.room.roomId,deviceToken:state.deviceToken,productUrl:v.productUrl,note:v.note,imageData});setMessage('✓ '+data.message);await refreshRoom();setTimeout(normalClose,900)}catch(e){setMessage(e.message,true)}finally{button.disabled=false;button.textContent='GỬI SẢN PHẨM'}}
    function compressImage(file){return new Promise((resolve,reject)=>{if(file.size>15*1024*1024)return reject(new Error('Ảnh gốc lớn hơn 15 MB.'));const img=new Image(),reader=new FileReader();reader.onerror=()=>reject(new Error('Không đọc được ảnh.'));reader.onload=()=>{img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.onerror=()=>reject(new Error('Ảnh không hợp lệ.'));img.src=reader.result};reader.readAsDataURL(file)})}

    function openScoreForm(teacherMode){const targetOptions=teacherMode?groupOptions():studentTargetOptions();showModal(`<h2>${teacherMode?'Giáo viên chấm':'Chấm điểm – '+esc(state.studentGroup.name)}</h2><form id="scoreForm" class="form-grid">${teacherMode?'':`<div class="note field full">Hệ thống đã nhận người chấm là <b>${esc(state.studentGroup.name)}</b>. Những nhóm đã chấm sẽ bị khóa trong danh sách.</div>`}<div class="field"><label>Nhóm được chấm</label><select name="targetId" required>${targetOptions}</select></div><div class="field"><label>Điểm (0–10)</label><input name="score" type="number" min="0" max="10" step="0.25" required></div><div class="field full"><label>Nhận xét</label><textarea name="comment"></textarea></div><div id="formMessage" class="message field full"></div><div class="field full"><button class="pill primary" type="submit">GỬI ĐIỂM</button></div></form>`);$('scoreForm').onsubmit=e=>submitScore(e,teacherMode)}
    async function submitScore(event,teacherMode){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),v=Object.fromEntries(new FormData(form)),target=groupName(v.targetId),actor=teacherMode?'Giáo viên':state.studentGroup.name;if(!await confirmInForm(form,'Xác nhận '+actor+' chấm '+target+' '+v.score+' điểm?'))return;button.disabled=true;button.textContent='ĐANG GỬI...';try{setMessage('Đang lưu điểm...');const data=await api({action:'submitScore',roomId:state.room.roomId,teacherMode,...(teacherMode?auth():{deviceToken:state.deviceToken}),targetId:v.targetId,score:v.score,comment:v.comment});setMessage('✓ '+data.message);await refreshRoom();setTimeout(normalClose,900)}catch(e){setMessage(e.message,true)}finally{button.disabled=false;button.textContent='GỬI ĐIỂM'}}
    function confirmInForm(form,message){return new Promise(resolve=>{const old=form.querySelector('.confirm-box');if(old)old.remove();const box=document.createElement('div');box.className='confirm-box';box.innerHTML=`<p>${esc(message)}</p><div class="confirm-actions"><button class="pill green" type="button">XÁC NHẬN</button><button class="pill" type="button">BỎ</button></div>`;const messageBox=form.querySelector('#formMessage');form.insertBefore(box,messageBox||form.lastElementChild);const buttons=box.querySelectorAll('button');buttons[0].onclick=()=>{box.remove();resolve(true)};buttons[1].onclick=()=>{box.remove();resolve(false)}})}

    async function openDeviceManager(){showModal('<h2>Duyệt thiết bị vào nhóm</h2><div class="note">Đang tải yêu cầu...</div>',true);await refreshDeviceManager()}
    async function refreshDeviceManager(){try{const data=await api({action:'listJoinRequests',...auth(),roomId:state.room.roomId}),byGroup=Object.fromEntries(state.groups.map(g=>[g.groupId,[]]));data.requests.forEach(r=>(byGroup[r.groupId]||=[]).push(r));const rows=state.groups.map(group=>{const items=byGroup[group.groupId]||[],approved=items.find(x=>x.status==='APPROVED'),pending=items.filter(x=>x.status==='PENDING');if(approved)return `<div class="device-row approved"><div><b>${esc(group.name)}</b><br><small>Đã duyệt</small></div><div>${esc(approved.deviceName)}</div><div class="device-actions"><button class="pill red revoke-device" data-group="${esc(group.groupId)}">THU HỒI</button></div></div>`;if(pending.length)return pending.map(item=>`<div class="device-row pending"><div><b>${esc(group.name)}</b><br><small>Chờ duyệt</small></div><div>${esc(item.deviceName)}</div><div class="device-actions"><button class="pill green approve-device" data-id="${esc(item.requestId)}">DUYỆT</button><button class="pill reject-device" data-id="${esc(item.requestId)}">TỪ CHỐI</button></div></div>`).join('');return `<div class="device-row"><div><b>${esc(group.name)}</b></div><div>Chưa có yêu cầu</div><div></div></div>`}).join('');$('dialogBody').innerHTML=`<h2>Duyệt thiết bị vào nhóm</h2><div class="note">Chỉ duyệt khi tên nhóm trên máy học sinh khớp với nhóm thực tế. Mỗi nhóm chỉ có một thiết bị được duyệt.</div><p><button class="pill" id="refreshDevices">↻ LÀM MỚI</button></p><div class="device-list">${rows}</div>`;$('refreshDevices').onclick=refreshDeviceManager;document.querySelectorAll('.approve-device').forEach(b=>b.onclick=()=>decideDevice(b.dataset.id,'APPROVED'));document.querySelectorAll('.reject-device').forEach(b=>b.onclick=()=>decideDevice(b.dataset.id,'REJECTED'));document.querySelectorAll('.revoke-device').forEach(b=>b.onclick=()=>revokeDevice(b.dataset.group))}catch(e){$('dialogBody').innerHTML=`<h2>Không tải được thiết bị</h2><div class="note error-note">${esc(e.message)}</div>`}}
    async function decideDevice(requestId,decision){try{const data=await api({action:'decideJoinRequest',...auth(),roomId:state.room.roomId,requestId,decision});toast(data.message);await refreshDeviceManager()}catch(e){toast(e.message)}}
    async function revokeDevice(groupId){if(!confirm('Thu hồi quyền thiết bị của '+groupName(groupId)+'?'))return;try{const data=await api({action:'revokeGroupDevice',...auth(),roomId:state.room.roomId,groupId});toast(data.message);await refreshDeviceManager()}catch(e){toast(e.message)}}

    function openResetVote(){showModal(`<h2>Cấp lại quyền chấm</h2><form id="resetForm" class="form-grid"><div class="field"><label>Người chấm</label><select name="evaluatorId">${groupOptions(true)}</select></div><div class="field"><label>Nhóm được chấm</label><select name="targetId">${groupOptions()}</select></div><div id="formMessage" class="message field full"></div><div class="field full"><button class="pill purple" type="submit">CẤP LẠI QUYỀN</button></div></form>`);$('resetForm').onsubmit=resetVote}
    async function resetVote(event){event.preventDefault();const form=event.currentTarget,v=Object.fromEntries(new FormData(form));try{setMessage('Đang xử lý...');const data=await api({action:'resetVote',...auth(),roomId:state.room.roomId,evaluatorId:v.evaluatorId,targetId:v.targetId});setMessage(data.message)}catch(e){setMessage(e.message,true)}}
    async function toggleRoom(){try{const status=state.room.status==='OPEN'?'CLOSED':'OPEN',data=await api({action:'setRoomStatus',...auth(),roomId:state.room.roomId,status});toast(data.message);await refreshRoom()}catch(e){toast(e.message)}}
    function showRoomQR(){showModal('<div></div>');renderRoomShare(state.room.roomId,false)}

    function openAdminPanel(){showModal(`<h2>Quản trị hệ thống</h2><form id="adminLogin" class="form-grid"><div class="field full"><label>Mã quản trị 6 số</label><input name="adminCode" type="password" inputmode="numeric" maxlength="6" required></div><div id="formMessage" class="message field full"></div><div class="field full"><button class="pill purple" type="submit">MỞ QUẢN TRỊ</button></div></form>`);$('adminLogin').onsubmit=loadAdminPanel}
    async function loadAdminPanel(event){event.preventDefault();const form=event.currentTarget,v=Object.fromEntries(new FormData(form));try{setMessage('Đang xác thực...');const data=await api({action:'adminOverview',adminCode:v.adminCode});sessionStorage.setItem('mrAdminCode',v.adminCode);renderAdminPanel(data)}catch(e){setMessage(e.message,true)}}
    function renderAdminPanel(data){const teachers=data.teachers.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.email)}</td><td>${esc(t.status)}</td></tr>`).join('');$('dialogBody').innerHTML=`<h2>Quản trị hệ thống</h2><div class="note">${data.teachers.length} giáo viên • ${data.roomCount} phòng. Mã mời và mã quản trị giữ nguyên cho đến khi bạn đổi tại đây.</div><form id="updateCodes" class="form-grid" style="margin-top:12px"><div class="field"><label>Mã mời giáo viên mới (để trống nếu giữ nguyên)</label><input name="newInviteCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}"></div><div class="field"><label>Mã quản trị mới (để trống nếu giữ nguyên)</label><input name="newAdminCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}"></div><div id="formMessage" class="message field full"></div><div class="field full"><button class="pill purple" type="submit">LƯU MÃ MỚI</button></div></form><h3>Giáo viên đã đăng ký</h3><table class="pin-table"><thead><tr><th>Họ tên</th><th>Email</th><th>Trạng thái</th></tr></thead><tbody>${teachers}</tbody></table>`;$('updateCodes').onsubmit=updateAdminCodes}
    async function updateAdminCodes(event){event.preventDefault();const form=event.currentTarget,v=Object.fromEntries(new FormData(form)),adminCode=sessionStorage.getItem('mrAdminCode');if(!v.newInviteCode&&!v.newAdminCode){setMessage('Hãy nhập ít nhất một mã mới.',true);return}if(!await confirmInForm(form,'Xác nhận thay đổi mã hệ thống?'))return;try{setMessage('Đang cập nhật...');const data=await api({action:'adminUpdateCodes',adminCode,newInviteCode:v.newInviteCode,newAdminCode:v.newAdminCode});if(v.newAdminCode)sessionStorage.setItem('mrAdminCode',v.newAdminCode);setMessage(data.message);form.reset()}catch(e){setMessage(e.message,true)}}

    function openPeerDetails(groupId){const group=state.groups.find(g=>g.groupId===groupId),items=state.scores.filter(s=>s.targetId===groupId&&s.type.includes('chéo'));showModal(`<h2>Chi tiết chấm chéo – ${esc(group.name)}</h2>${items.length?items.map(s=>`<div class="note"><b>${esc(groupName(s.evaluatorId))} chấm ${fmt(s.score)} điểm</b>${s.comment?'<br>'+esc(s.comment):''}</div>`).join(''):'<div class="note">Chưa có lượt chấm chéo.</div>'}`)}
    function openTotal(groupId){const data=calculate()[groupId],group=state.groups.find(g=>g.groupId===groupId);showModal(`<h2>Tổng tạm tính – ${esc(group.name)}</h2><div class="note">Tự chấm ${state.room.selfWeight}%: <b>${fmt(data.selfAvg)}</b></div><div class="note">Trung bình ${data.peer.length} lượt chấm chéo ${state.room.peerWeight}%: <b>${fmt(data.peerAvg)}</b></div><div class="note">Giáo viên ${state.room.teacherWeight}%: <b>${fmt(data.teacherAvg)}</b></div><h2 style="margin-top:14px;color:#d34820">TỔNG: ${fmt(data.total)}</h2>`)}
    function groupName(id){if(id==='TEACHER')return'Giáo viên';return state.groups.find(g=>g.groupId===id)?.name||id}
    function openImage(src){state.rotation=0;showModal(`<div class="viewer"><img id="fullImage" src="${esc(src)}" alt="Ảnh sản phẩm"><div class="viewer-tools"><button class="pill" id="left">↶ Xoay trái</button><button class="pill" id="origin">Ảnh gốc</button><button class="pill" id="right">Xoay phải ↷</button></div></div>`,true);const apply=()=>{$('fullImage').style.transform='rotate('+state.rotation+'deg)'};$('left').onclick=()=>{state.rotation-=90;apply()};$('right').onclick=()=>{state.rotation+=90;apply()};$('origin').onclick=()=>{state.rotation=0;apply()}}

    $('homeButton').onclick=()=>state.teacher?renderDashboard():renderLanding();$('joinButton').onclick=openJoin;$('teacherButton').onclick=()=>state.teacher?renderDashboard():openTeacherLogin;$('closeModal').onclick=normalClose;$('modal').onclick=e=>{if(e.target===$('modal'))normalClose()};document.addEventListener('keydown',e=>{if(e.key==='Escape')normalClose()});
    (async function start(){const saved=sessionStorage.getItem('mrTeacher');if(saved){try{state.credentials=JSON.parse(saved);const data=await api({action:'loginTeacher',email:state.credentials.email,pin:state.credentials.pin});state.teacher=data.teacher;state.rooms=data.rooms||[]}catch{sessionStorage.removeItem('mrTeacher');state.credentials=null}}const room=new URLSearchParams(location.search).get('room');if(room)openRoom(room,false);else renderLanding()})();
  </script>
</body>
</html>
