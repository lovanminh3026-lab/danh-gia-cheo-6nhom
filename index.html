<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8fc"><title>Tổng hợp đánh giá sản phẩm nhóm</title>
<style>
:root{--ink:#17324b;--muted:#607487;--soft:#eaf2f8;--self:#14804a;--self-bg:#e7f7ee;--peer:#c65b09;--peer-bg:#fff1dd;--teacher:#1769c2;--teacher-bg:#e7f1ff}*{box-sizing:border-box;min-width:0}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{min-height:100dvh;font-family:Arial,sans-serif;color:var(--ink);background:#f4f8fc}.app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;width:100%;height:100dvh;overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px clamp(10px,1.6vw,24px);background:#fff;box-shadow:0 2px 12px #18324b1a}h1{margin:0;font-size:clamp(17px,1.85vw,27px);line-height:1.15;white-space:nowrap}.actions{display:flex;flex:0 0 auto;gap:7px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 13px;border:0;border-radius:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap;cursor:pointer}.photo{background:#078b78}.score{background:#1677d2}.manage{background:#7656b5}.status{padding:4px 14px 2px;color:var(--muted);font-size:11px;text-align:right}.status.error{color:#b42318;background:#fff1f0}.grid{display:grid;gap:clamp(6px,.75vw,12px);min-height:0;padding:6px clamp(6px,1vw,14px) 8px;overflow:hidden}.card{display:grid;grid-template-rows:minmax(70px,45%) minmax(0,55%);min-height:0;overflow:hidden;border:1px solid #dbe7f0;border-radius:13px;background:#fff;box-shadow:0 4px 14px #1f446517}.photo-box{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:var(--soft)}.photo-box.clickable{cursor:pointer}.photo-box img{display:block;width:100%;height:100%;object-fit:contain;background:#edf4f8}.empty{padding:8px;color:#8294a2;font-size:clamp(12px,1.15vw,18px);font-weight:800;text-align:center}.file-icon{font-size:clamp(34px,5vw,70px)}.file-label{margin-top:4px;color:#526b7e;font-size:12px;font-weight:800}.file-badge{position:absolute;top:6px;left:6px;padding:4px 7px;border-radius:7px;color:#fff;background:#17324bcc;font-size:10px;font-weight:900}.view-product{position:absolute;right:6px;bottom:6px;padding:5px 8px;border:0;border-radius:7px;color:#fff;background:#087f6fdd;font-size:10px;font-weight:900;cursor:pointer}.info{display:flex;flex-direction:column;min-height:0;padding:clamp(6px,.75vw,10px);overflow:hidden}.name-row{display:flex;align-items:center;justify-content:space-between;gap:7px}.group-name{font-size:clamp(15px,1.3vw,21px);font-weight:850}.total-button{flex:0 0 auto;padding:5px 9px;border:0;border-radius:9px;color:#fff;background:linear-gradient(135deg,#e75424,#c93b18);font-size:clamp(9px,.8vw,12px);font-weight:900;cursor:pointer}.product-name{margin:2px 0 5px;overflow:hidden;color:var(--muted);font-size:clamp(11px,.95vw,15px);line-height:1.2;text-overflow:ellipsis;white-space:nowrap}.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:auto}.score-item{padding:5px 3px;border-radius:8px;font-size:clamp(10px,.8vw,13px);line-height:1.15;text-align:center;overflow-wrap:anywhere}.score-label{display:block;font-weight:700}.score-item b{display:block;margin-top:2px;font-size:1.2em}.score-self{color:var(--self);background:var(--self-bg)}.score-peer{color:var(--peer);background:var(--peer-bg);border:0;cursor:pointer;font-family:inherit}.score-teacher{color:var(--teacher);background:var(--teacher-bg)}.comments-button{align-self:flex-start;margin-top:5px;padding:3px 7px;border:1px solid #d6e2ec;border-radius:7px;color:#506779;background:#f7fafc;font-size:10px;font-weight:700;cursor:pointer}.pager{display:none;align-items:center;justify-content:center;gap:10px;padding:2px 8px 7px}.pager.show{display:flex}.pager button{min-width:38px;min-height:28px;border:1px solid #c8d8e5;border-radius:8px;color:#254c6d;background:#fff;font-weight:900;cursor:pointer}.page-label{font-size:11px;font-weight:800;color:#607487}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:10px;background:#000000f2}.modal.show{display:flex}.close{position:absolute;top:6px;right:10px;z-index:3;width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:42px;cursor:pointer}.image-viewer,.product-viewer{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:8px}.image-viewer.show,.product-viewer.show{display:flex}.image-stage{display:flex;align-items:center;justify-content:center;width:100%;min-height:0;flex:1;overflow:hidden}#fullImage{display:block;max-width:96vw;max-height:calc(100dvh - 90px);object-fit:contain;transform-origin:center;transition:transform .2s}#fullImage.quarter-turn{max-width:calc(100dvh - 90px);max-height:96vw}.product-frame{width:min(96vw,1400px);height:calc(100dvh - 74px);border:0;border-radius:9px;background:#fff}.viewer-tools{display:flex;gap:8px}.tool-button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 12px;border:1px solid #ffffff55;border-radius:10px;color:#fff;background:#ffffff20;text-decoration:none;font-size:14px;font-weight:800;cursor:pointer}.comments-viewer,.form-viewer{display:none;width:min(92vw,760px);max-height:88dvh;overflow:auto;padding:18px;border-radius:15px;background:#fff;color:var(--ink)}.comments-viewer.show,.form-viewer.show{display:block}.comments-viewer h2,.form-viewer h2{margin:0 0 12px;font-size:22px}.comment{margin-top:8px;padding:10px;border-radius:10px;background:#f2f7fb;font-size:14px}.comment-meta{margin-bottom:4px;color:var(--muted);font-size:12px;font-weight:700}.detail-score{font-size:18px;font-weight:900;color:var(--peer)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:var(--muted)}.field input,.field select,.field textarea{width:100%;min-height:42px;padding:9px 10px;border:1px solid #bfd0de;border-radius:9px;background:#fff;color:var(--ink);font:inherit}.field textarea{min-height:70px}.submit-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.primary,.secondary,.danger{min-height:42px;padding:9px 14px;border:0;border-radius:9px;color:#fff;background:#1677d2;font-weight:850;cursor:pointer}.secondary{background:#7656b5}.danger{background:#c9362b}.form-note{margin:0 0 12px;padding:9px;border-radius:8px;background:#edf6ff;color:#315c80;font-size:12px;line-height:1.35}.form-message{min-height:18px;margin-top:8px;white-space:pre-line;font-size:13px;font-weight:700}.form-message.error{color:#b42318}.form-message.success{color:#14804a}.check-list{display:grid;gap:7px;margin-top:4px;padding:10px;border-radius:9px;background:#fff6f4}.check-list label{display:flex;align-items:center;gap:8px;color:#7e2f28;font-size:13px;font-weight:700}.check-list input{width:18px;min-height:18px;margin:0}
@media(max-width:640px){.topbar{gap:6px;padding:7px 6px}h1{max-width:42%;font-size:12px;white-space:normal}.actions{gap:4px}.button{min-height:34px;padding:6px 7px;font-size:10px}.manage{width:34px;padding:5px}.manage-label{display:none}.status{padding:2px 6px;font-size:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(3,minmax(0,1fr))!important;gap:5px;padding:4px}.card{grid-template-rows:minmax(52px,43%) minmax(0,57%);border-radius:9px}.info{padding:4px}.group-name{font-size:13px}.total-button{padding:3px 5px;font-size:7px}.product-name{margin:1px 0 3px;font-size:9px}.scores{gap:3px}.score-item{padding:3px 1px;font-size:8px}.score-item b{font-size:11px}.comments-button{margin-top:3px;padding:2px 5px;font-size:8px}.empty{font-size:11px}.file-badge,.view-product{font-size:7px;padding:3px 4px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.submit-row{align-items:stretch;flex-direction:column}.primary,.secondary,.danger{width:100%}.product-frame{width:98vw;height:calc(100dvh - 70px)}}@media(max-height:620px){.product-name{display:none}.comments-button{margin-top:2px}}
</style>
</head>
<body>
<div class="app"><header class="topbar"><h1>TỔNG HỢP ĐÁNH GIÁ SẢN PHẨM NHÓM</h1><nav class="actions"><a class="button photo" href="https://docs.google.com/forms/d/e/1FAIpQLSfCxfr6o_anyQH-GuJynQB8LQO9zdh2cB06GUTB7u2U6tr-xg/viewform" target="_blank" rel="noopener">GỬI SẢN PHẨM</a><button id="openScoreForm" class="button score">CHẤM ĐIỂM</button><button id="openManager" class="button manage">⚙ <span class="manage-label">QUẢN LÝ</span></button></nav></header><div id="status" class="status">Đang tải dữ liệu…</div><main id="grid" class="grid"></main><div id="pager" class="pager"><button id="previousPage">‹</button><span id="pageLabel" class="page-label"></span><button id="nextPage">›</button></div></div>
<div id="modal" class="modal"><button id="closeModal" class="close" aria-label="Đóng">×</button><div id="imageViewer" class="image-viewer"><div class="image-stage"><img id="fullImage" alt="Ảnh sản phẩm phóng to"></div><div class="viewer-tools"><button id="rotateLeft" class="tool-button">↶ Xoay trái</button><button id="resetRotation" class="tool-button">Ảnh gốc</button><button id="rotateRight" class="tool-button">Xoay phải ↷</button></div></div><div id="productViewer" class="product-viewer"><iframe id="productFrame" class="product-frame" title="Xem sản phẩm" allow="autoplay; fullscreen" allowfullscreen></iframe><div class="viewer-tools"><a id="openOriginal" class="tool-button" target="_blank" rel="noopener">MỞ LIÊN KẾT GỐC</a></div></div><section id="commentsViewer" class="comments-viewer"></section><section id="formViewer" class="form-viewer"></section></div>
<script>
const SHEET_ID='1Ga7dLZHSaSkYFB8FDvCfvvZ0QMYe3hwLZo_sjT0Rkys',API_URL='https://script.google.com/macros/s/AKfycbzLcPTUoKneqrLyrFWMHbRAgS-Y_Cyx0ziMcYe9cTgn9DpyS58MYyS3to6N3cknjVQFIg/exec',PAGE_SIZE=6;
const SHEETS={summary:{name:'Tổng hợp',range:'A5:B16',callback:'receiveSummary'},products:{name:'Ảnh sản phẩm',range:'A2:H20',callback:'receiveProducts'},scores:{name:'Dữ liệu chấm',range:'A2:G1000',callback:'receiveScores'}};
let GROUP_NAMES=Array.from({length:6},(_,i)=>'Nhóm '+(i+1)),summaryRows=GROUP_NAMES.map(name=>[name,'']),products={},scoreRows=[],scoreData={},pending=0,rotation=0,currentPage=0;
const $=id=>document.getElementById(id);function escapeHtml(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function displayValue(cell){if(!cell)return'';if(cell.v!==undefined&&cell.v!==null)return String(cell.v);if(cell.f!==undefined&&cell.f!==null)return String(cell.f);return''}function allRows(response){const rows=response?.table?.rows||[],width=response?.table?.cols?.length||0;return rows.map(row=>Array.from({length:width},(_,i)=>displayValue(row?.c?.[i])))}
window.receiveSummary=response=>{const rows=allRows(response).filter(row=>/^(?:nhóm|nhom)\s*\d+$/i.test(String(row[0]||'').trim())).slice(0,12);if(rows.length>=2){summaryRows=rows.map(row=>[normalizeGroup(row[0]),row[1]||'']);GROUP_NAMES=summaryRows.map(row=>row[0]);currentPage=Math.min(currentPage,Math.max(0,Math.ceil(GROUP_NAMES.length/PAGE_SIZE)-1))}calculateScores();finishRequest()};
window.receiveProducts=response=>{products={};allRows(response).forEach(row=>{const group=normalizeGroup(row[0]);if(GROUP_NAMES.includes(group))products[group]={group,type:(row[1]||'ẢNH').toUpperCase(),coverUrl:row[2]||'',productUrl:row[3]||row[2]||'',note:row[4]||'',submittedAt:row[5]||'',fileName:row[6]||'',mime:row[7]||''}});finishRequest()};window.receiveScores=response=>{scoreRows=allRows(response);calculateScores();finishRequest()};
function normalizeGroup(value){const text=String(value||'').trim().toLowerCase(),number=text.match(/(?:nhóm|nhom)\s*(\d+)/)?.[1];return number?'Nhóm '+Number(number):String(value||'').trim()}function scoreNumber(value){const number=Number(String(value||'').replace(',','.'));return Number.isFinite(number)?number:null}function average(values){return values.length?values.reduce((a,b)=>a+b,0)/values.length:null}function classifyScore(evaluator,target,type){const value=String(type||'').toLowerCase();if(value.includes('giáo viên')||value.includes('giao vien')||String(evaluator).toLowerCase().includes('giáo viên'))return'teacher';if(value.includes('tự chấm')||value.includes('tu cham'))return'self';if(value.includes('chéo')||value.includes('cheo'))return'peer';return normalizeGroup(evaluator)===normalizeGroup(target)?'self':'peer'}
function calculateScores(){const result={};GROUP_NAMES.forEach(group=>result[group]={entries:new Map(),selfValues:[],peerValues:[],teacherValues:[],peerDetails:[],comments:[]});scoreRows.forEach(row=>{const evaluator=row[1]||'',target=normalizeGroup(row[2]),kind=classifyScore(evaluator,target,row[3]),score=scoreNumber(row[4]),comment=row[5]||'',status=String(row[6]||'').toLowerCase();if(!result[target]||score===null||status.includes('thu hồi')||status.includes('hết hiệu lực'))return;const who=kind==='teacher'?'Giáo viên':normalizeGroup(evaluator);result[target].entries.set(kind+'|'+who,{evaluator:evaluator||'Không ghi tên',target,kind,score,comment:comment.trim()})});GROUP_NAMES.forEach(group=>{const item=result[group];item.entries.forEach(entry=>{item[entry.kind+'Values'].push(entry.score);if(entry.kind==='peer')item.peerDetails.push(entry);if(entry.comment)item.comments.push({evaluator:entry.evaluator,type:entry.kind,text:entry.comment,score:entry.score})});delete item.entries;item.self=average(item.selfValues);item.peer=average(item.peerValues);item.teacher=average(item.teacherValues);item.peerCount=item.peerValues.length;item.complete=item.self!==null&&item.teacher!==null&&item.peerCount>=1;item.total=item.complete?item.self*.2+item.peer*.3+item.teacher*.5:null});scoreData=result}
function loadSheet(config,key){document.getElementById('jsonp-'+key)?.remove();const script=document.createElement('script');script.id='jsonp-'+key;script.onerror=()=>setStatus('Không đọc được Google Sheet. Kiểm tra quyền chia sẻ.',true);const params=new URLSearchParams({tqx:'out:json;responseHandler:'+config.callback,sheet:config.name,range:config.range,_:Date.now()});script.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?'+params;document.head.appendChild(script)}function refreshData(){pending=3;loadSheet(SHEETS.summary,'summary');loadSheet(SHEETS.products,'products');loadSheet(SHEETS.scores,'scores')}function finishRequest(){pending=Math.max(0,pending-1);render();if(!pending)setStatus('Đã cập nhật lúc '+new Date().toLocaleTimeString('vi-VN'),false)}
function driveFileId(url){const value=String(url||''),a=value.match(/[?&]id=([^&]+)/),b=value.match(/\/d\/([a-zA-Z0-9_-]{20,})/),c=value.match(/[a-zA-Z0-9_-]{25,}/);return a?a[1]:b?b[1]:c?c[0]:''}function imageUrl(url){const id=driveFileId(url);return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1600':url}function previewUrl(url){const value=String(url||'').trim(),id=driveFileId(value),docs=value.match(/docs\.google\.com\/(presentation|document|spreadsheets)\/d\/([a-zA-Z0-9_-]+)/i),youtube=value.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/i);if(docs)return'https://docs.google.com/'+docs[1]+'/d/'+docs[2]+'/preview';if(id)return'https://drive.google.com/file/d/'+id+'/preview';if(youtube)return'https://www.youtube.com/embed/'+youtube[1]+'?autoplay=1';return value}function safeText(value,fallback='—'){return value===undefined||value===null||value===''?fallback:String(value)}function formatScore(value){return value===null||value===undefined?'—':value.toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2})}function fileIcon(type){if(type.includes('VIDEO'))return'▶️';if(type.includes('POWER')||type.includes('PPT'))return'📊';if(type.includes('PDF'))return'📕';if(type.includes('ẢNH'))return'🖼️';return'🔗'}
function scoreItem(label,value,className,onClick){const item=document.createElement(onClick?'button':'div');if(onClick)item.type='button';item.className='score-item '+className;item.innerHTML='<span class="score-label">'+label+(onClick?' ⓘ':'')+'</span><b>'+formatScore(value)+'</b>';if(onClick)item.addEventListener('click',onClick);return item}
function render(){const grid=document.getElementById('grid'),pageGroups=GROUP_NAMES.slice(currentPage*PAGE_SIZE,(currentPage+1)*PAGE_SIZE),count=pageGroups.length,columns=count<=3?Math.max(1,count):count===4?2:3,rows=Math.ceil(count/columns);grid.style.gridTemplateColumns='repeat('+columns+',minmax(0,1fr))';grid.style.gridTemplateRows='repeat('+rows+',minmax(0,1fr))';grid.replaceChildren();pageGroups.forEach(group=>{const i=GROUP_NAMES.indexOf(group),row=summaryRows[i]||[group,''],data=scoreData[group]||{},product=products[group],card=document.createElement('article');card.className='card';const photoBox=document.createElement('div');photoBox.className='photo-box';if(product&&(product.coverUrl||product.productUrl)){photoBox.classList.add('clickable');if(product.coverUrl){const img=document.createElement('img');img.src=imageUrl(product.coverUrl);img.alt='Sản phẩm của '+group;photoBox.appendChild(img)}else{const holder=document.createElement('div');holder.className='empty';holder.innerHTML='<div class="file-icon">'+fileIcon(product.type)+'</div><div class="file-label">'+safeText(product.fileName,product.type)+'</div>';photoBox.appendChild(holder)}const badge=document.createElement('span');badge.className='file-badge';badge.textContent=product.type;photoBox.appendChild(badge);if(product.productUrl){const view=document.createElement('button');view.className='view-product';view.textContent='XEM SẢN PHẨM';view.addEventListener('click',event=>{event.stopPropagation();openProduct(product)});photoBox.appendChild(view)}photoBox.addEventListener('click',()=>product.productUrl&&!product.type.includes('ẢNH')?openProduct(product):openImage(imageUrl(product.coverUrl||product.productUrl),'Sản phẩm của '+group))}else{const empty=document.createElement('div');empty.className='empty';empty.textContent='CHƯA GỬI SẢN PHẨM';photoBox.appendChild(empty)}const info=document.createElement('div');info.className='info';const nameRow=document.createElement('div');nameRow.className='name-row';const name=document.createElement('div');name.className='group-name';name.textContent=group;nameRow.appendChild(name);if(data.complete){const total=document.createElement('button');total.className='total-button';total.textContent='TẠM TÍNH: '+formatScore(data.total);total.addEventListener('click',()=>openTotalSummary(group,data));nameRow.appendChild(total)}const title=document.createElement('div');title.className='product-name';title.textContent=safeText(row[1],product?.note||'Chưa cập nhật tên sản phẩm');const scores=document.createElement('div');scores.className='scores';scores.append(scoreItem('Tự chấm',data.self,'score-self'),scoreItem('Chấm chéo '+(data.peerCount||0)+' lượt',data.peer,'score-peer',()=>openPeerDetails(group,data.peerDetails||[])),scoreItem('GV chấm',data.teacher,'score-teacher'));info.append(nameRow,title,scores);if(data.comments?.length){const comments=document.createElement('button');comments.className='comments-button';comments.textContent='💬 '+data.comments.length+' nhận xét';comments.addEventListener('click',()=>openComments(group,data.comments));info.appendChild(comments)}card.append(photoBox,info);grid.appendChild(card)});renderPager()}
function renderPager(){const count=Math.ceil(GROUP_NAMES.length/PAGE_SIZE),pager=$('pager');pager.classList.toggle('show',count>1);$('pageLabel').textContent='Trang '+(currentPage+1)+'/'+count;$('previousPage').disabled=currentPage===0;$('nextPage').disabled=currentPage>=count-1}function changePage(delta){currentPage=Math.max(0,Math.min(Math.ceil(GROUP_NAMES.length/PAGE_SIZE)-1,currentPage+delta));render()}function setStatus(message,error){$('status').textContent=message;$('status').classList.toggle('error',!!error)}function openModal(full=false){$('modal').classList.add('show');if(full&&$('modal').requestFullscreen&&!document.fullscreenElement)$('modal').requestFullscreen().catch(()=>{})}function hideViewers(){['imageViewer','productViewer','commentsViewer','formViewer'].forEach(id=>$(id).classList.remove('show'))}function openImage(src,alt){rotation=0;hideViewers();$('imageViewer').classList.add('show');$('fullImage').src=src;$('fullImage').alt=alt;applyRotation();openModal(true)}function openProduct(product){hideViewers();$('productViewer').classList.add('show');$('productFrame').src=previewUrl(product.productUrl);$('openOriginal').href=product.productUrl;openModal(true)}
function typeName(type){return type==='self'?'Tự chấm':type==='teacher'?'Giáo viên':'Chấm chéo'}function openComments(group,items){hideViewers();const box=$('commentsViewer');box.classList.add('show');box.innerHTML='<h2>Nhận xét – '+escapeHtml(group)+'</h2>'+items.map(item=>'<div class="comment"><div class="comment-meta">'+escapeHtml(item.evaluator)+' • '+typeName(item.type)+' • '+formatScore(item.score)+' điểm</div><div>'+escapeHtml(item.text)+'</div></div>').join('');openModal()}function openPeerDetails(group,items){hideViewers();const box=$('commentsViewer');box.classList.add('show');box.innerHTML='<h2>Chi tiết chấm chéo – '+escapeHtml(group)+'</h2>'+(items.length?items.map(item=>'<div class="comment"><div class="detail-score">'+escapeHtml(item.evaluator)+' chấm '+escapeHtml(item.target)+': '+formatScore(item.score)+' điểm</div>'+(item.comment?'<div>Nhận xét: '+escapeHtml(item.comment)+'</div>':'')+'</div>').join(''):'<div class="comment">Chưa có nhóm nào chấm chéo.</div>');openModal()}function openTotalSummary(group,data){hideViewers();const box=$('commentsViewer');box.classList.add('show');box.innerHTML='<h2>TỔNG TẠM TÍNH – '+escapeHtml(group)+'</h2><div class="comment">Tự chấm × 20%: '+formatScore(data.self)+'</div><div class="comment">Trung bình '+data.peerCount+' lượt chấm chéo × 30%: '+formatScore(data.peer)+'</div><div class="comment">Giáo viên × 50%: '+formatScore(data.teacher)+'</div><div class="comment detail-score">ĐIỂM TỔNG TẠM TÍNH: '+formatScore(data.total)+'</div>';openModal()}
function groupOptions(teacher=false){return GROUP_NAMES.map(name=>'<option>'+name+'</option>').join('')+(teacher?'<option>Giáo viên</option>':'')}function escapeAttribute(value){return escapeHtml(value)}function openScoreForm(){hideViewers();const viewer=$('formViewer');viewer.classList.add('show');viewer.innerHTML='<h2>Chấm điểm sản phẩm</h2><p class="form-note">Điểm tổng tạm tính xuất hiện khi có tự chấm, giáo viên chấm và ít nhất một lượt chấm chéo.</p><form id="scoreForm" class="form-grid"><div class="field"><label>Người chấm</label><select name="evaluator">'+groupOptions(true)+'</select></div><div class="field"><label>Nhóm được chấm</label><select name="target">'+groupOptions()+'</select></div><div class="field"><label>Điểm (0–10)</label><input name="score" type="number" min="0" max="10" step="0.25" required></div><div class="field"><label>Mã PIN</label><input name="pin" type="password" inputmode="numeric" maxlength="4" required></div><div class="field full"><label>Nhận xét</label><textarea name="comment"></textarea></div><div class="field full"><div class="submit-row"><button class="secondary" id="openReset" type="button">GV: Cấp lại quyền chấm</button><button class="primary">GỬI ĐIỂM</button></div><div id="formMessage" class="form-message"></div></div></form>';$('scoreForm').addEventListener('submit',submitScore);$('openReset').addEventListener('click',openResetForm);openModal()}function openResetForm(){const viewer=$('formViewer');viewer.innerHTML='<h2>Cấp lại quyền chấm</h2><form id="resetForm" class="form-grid"><div class="field"><label>Người được chấm lại</label><select name="evaluator">'+groupOptions(true)+'</select></div><div class="field"><label>Nhóm được chấm</label><select name="target">'+groupOptions()+'</select></div><div class="field full"><label>Mã giáo viên</label><input name="teacherPin" type="password" required></div><div class="field full"><div class="submit-row"><button class="secondary" id="backScore" type="button">Quay lại</button><button class="primary">CẤP LẠI QUYỀN</button></div><div id="formMessage" class="form-message"></div></div></form>';$('resetForm').addEventListener('submit',resetPermission);$('backScore').addEventListener('click',openScoreForm)}
function managerFields(count,values=[]){return Array.from({length:count},(_,i)=>'<div class="field"><label>Nhóm '+(i+1)+' – tên đội/sản phẩm</label><input class="group-title" maxlength="100" value="'+escapeAttribute(values[i]??summaryRows[i]?.[1]??'')+'"></div>').join('')}function openManager(){hideViewers();const viewer=$('formViewer');viewer.classList.add('show');viewer.innerHTML='<h2>⚙ Quản lý buổi chấm</h2><p class="form-note">Chọn từ 2 đến 12 nhóm. Trên 6 nhóm, trang tự chia thành nhiều trang.</p><div class="form-grid"><div class="field full"><label>Số nhóm</label><input id="groupCount" type="number" min="2" max="12" value="'+GROUP_NAMES.length+'"></div><div id="managerNames" class="field full"><div class="form-grid">'+managerFields(GROUP_NAMES.length)+'</div></div><div class="field full"><label>Mã giáo viên</label><input id="managerPin" type="password"></div><div class="field full"><button id="saveGroupNames" class="primary">LƯU SỐ NHÓM VÀ TÊN ĐỘI</button></div><div class="field full"><label>Đặt lại dữ liệu</label><div class="check-list"><label><input id="resetScores" type="checkbox" checked> Xóa điểm và nhận xét</label><label><input id="resetPhotos" type="checkbox" checked> Xóa sản phẩm đang hiển thị</label><label><input id="resetNames" type="checkbox"> Xóa tên đội/sản phẩm</label></div><button id="resetSession" class="danger">ĐẶT LẠI BUỔI CHẤM</button><div id="formMessage" class="form-message"></div></div></div>';$('groupCount').addEventListener('change',refreshManagerFields);$('saveGroupNames').addEventListener('click',saveGroupSettings);$('resetSession').addEventListener('click',resetSessionData);openModal()}function refreshManagerFields(){const count=Math.max(2,Math.min(12,Number($('groupCount').value)||6)),old=Array.from(document.querySelectorAll('.group-title'),x=>x.value);$('managerNames').innerHTML='<div class="form-grid">'+managerFields(count,old)+'</div>'}
function showFormMessage(message,error=false){const box=$('formMessage');if(box){box.textContent=message;box.className='form-message '+(error?'error':'success')}}async function postApi(payload){const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}),raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw new Error('Hãy triển khai Apps Script thành Phiên bản mới.')}if(!data.ok)throw new Error(data.message);return data}async function submitScore(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type=submit]'),values=Object.fromEntries(new FormData(form));button.disabled=true;try{showFormMessage('Đang lưu...');const data=await postApi({action:'submitScore',...values});showFormMessage(data.message);form.reset();setTimeout(refreshData,800)}catch(e){showFormMessage(e.message,true)}finally{button.disabled=false}}async function resetPermission(event){event.preventDefault();const form=event.currentTarget,values=Object.fromEntries(new FormData(form));try{showFormMessage('Đang xử lý...');const data=await postApi({action:'resetPermission',...values});showFormMessage(data.message)}catch(e){showFormMessage(e.message,true)}}async function saveGroupSettings(){const names=Array.from(document.querySelectorAll('.group-title'),x=>x.value.trim()),count=Math.max(2,Math.min(12,Number($('groupCount').value)||6));try{showFormMessage('Đang lưu...');const data=await postApi({action:'updateGroupSettings',teacherPin:$('managerPin').value,groupCount:count,names});showFormMessage(data.message);setTimeout(refreshData,900)}catch(e){showFormMessage(e.message,true)}}async function resetSessionData(){if(!confirm('Bạn chắc chắn muốn đặt lại dữ liệu đã chọn?'))return;try{const data=await postApi({action:'resetSession',teacherPin:$('managerPin').value,resetScores:$('resetScores').checked,resetPhotos:$('resetPhotos').checked,resetNames:$('resetNames').checked});showFormMessage(data.message);setTimeout(refreshData,900)}catch(e){showFormMessage(e.message,true)}}
// Bản sửa: nút GỬI ĐIỂM trong HTML không khai báo type nên bộ chọn cũ trả về null.
// Dùng bộ chọn dự phòng, đồng thời đưa thông báo lên ngay trên hàng nút để điện thoại luôn nhìn thấy.
submitScore=async function(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]')||form.querySelector('.primary'),messageBox=$('formMessage'),submitRow=form.querySelector('.submit-row'),oldLabel=button?button.textContent:'GỬI ĐIỂM';if(messageBox&&submitRow&&messageBox.nextElementSibling!==submitRow)submitRow.parentElement.insertBefore(messageBox,submitRow);if(button){button.disabled=true;button.textContent='ĐANG GỬI...'}try{showFormMessage('Đang gửi điểm, vui lòng chờ...');const values=Object.fromEntries(new FormData(form)),data=await postApi({action:'submitScore',...values});showFormMessage('✓ '+data.message);form.reset();setTimeout(refreshData,800)}catch(e){showFormMessage('Không gửi được: '+(e&&e.message?e.message:'Lỗi kết nối tới Apps Script.'),true)}finally{if(button){button.disabled=false;button.textContent=oldLabel}}};
function applyRotation(){const value=((rotation%360)+360)%360,image=$('fullImage');image.style.transform='rotate('+rotation+'deg)';image.classList.toggle('quarter-turn',value===90||value===270)}function closeModal(){const layer=$('modal');layer.classList.remove('show');hideViewers();$('productFrame').src='about:blank';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
$('openScoreForm').addEventListener('click',openScoreForm);$('openManager').addEventListener('click',openManager);$('previousPage').addEventListener('click',()=>changePage(-1));$('nextPage').addEventListener('click',()=>changePage(1));$('rotateLeft').addEventListener('click',()=>{rotation-=90;applyRotation()});$('rotateRight').addEventListener('click',()=>{rotation+=90;applyRotation()});$('resetRotation').addEventListener('click',()=>{rotation=0;applyRotation()});$('closeModal').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});calculateScores();render();refreshData();setInterval(refreshData,5000);
</script>
</body></html>
