<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8fc">
  <title>Tổng hợp đánh giá sản phẩm nhóm</title>
  <style>
    :root{--ink:#17324b;--muted:#607487;--soft:#eaf2f8;--self:#14804a;--self-bg:#e7f7ee;--peer:#c65b09;--peer-bg:#fff1dd;--teacher:#1769c2;--teacher-bg:#e7f1ff;--total:#d4481d}
    *{box-sizing:border-box;min-width:0}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{min-height:100dvh;font-family:Arial,"Helvetica Neue",sans-serif;color:var(--ink);background:#f4f8fc}
    .app{display:grid;grid-template-rows:auto auto minmax(0,1fr);width:100%;height:100dvh;overflow:hidden}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px clamp(10px,1.6vw,24px);background:#fff;box-shadow:0 2px 12px #18324b1a}
    h1{margin:0;font-size:clamp(17px,1.85vw,27px);line-height:1.15;letter-spacing:-.02em;white-space:nowrap}
    .actions{display:flex;flex:0 0 auto;gap:7px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 13px;border-radius:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap}
    .button.photo{background:#078b78}.button.score{background:#1677d2;border:0;cursor:pointer}
    .status{padding:4px 14px 2px;color:var(--muted);font-size:11px;line-height:1.15;text-align:right}.status.error{color:#b42318;background:#fff1f0}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(6px,.75vw,12px);min-height:0;padding:6px clamp(6px,1vw,14px) 10px;overflow:hidden}
    .card{display:grid;grid-template-rows:minmax(70px,45%) minmax(0,55%);min-height:0;overflow:hidden;border:1px solid #dbe7f0;border-radius:13px;background:#fff;box-shadow:0 4px 14px #1f446517}
    .photo-box{display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:var(--soft)}.photo-box.has-image{cursor:zoom-in}
    .photo-box img{display:block;width:100%;height:100%;object-fit:contain;background:#edf4f8}.empty{padding:8px;color:#8294a2;font-size:clamp(12px,1.15vw,18px);font-weight:800;text-align:center}
    .info{display:flex;flex-direction:column;min-height:0;padding:clamp(6px,.75vw,10px);overflow:hidden}.name-row{display:flex;align-items:center;justify-content:space-between;gap:7px}
    .group-name{font-size:clamp(15px,1.3vw,21px);font-weight:850}.total-button{flex:0 0 auto;padding:5px 9px;border:0;border-radius:9px;color:#fff;background:linear-gradient(135deg,#e75424,#c93b18);font-size:clamp(10px,.82vw,13px);font-weight:900;cursor:pointer;box-shadow:0 2px 7px #c93b1833}
    .product{margin:2px 0 5px;overflow:hidden;color:var(--muted);font-size:clamp(11px,.95vw,15px);line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
    .scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:auto}.score-item{padding:5px 3px;border-radius:8px;font-size:clamp(10px,.8vw,13px);line-height:1.15;text-align:center;overflow-wrap:anywhere}
    .score-label{display:block;font-weight:700}.score-item b{display:block;margin-top:2px;font-size:1.2em}.score-self{color:var(--self);background:var(--self-bg)}.score-peer{color:var(--peer);background:var(--peer-bg);border:0;cursor:pointer;font-family:inherit}.score-teacher{color:var(--teacher);background:var(--teacher-bg)}
    .comments-button{align-self:flex-start;margin-top:5px;padding:3px 7px;border:1px solid #d6e2ec;border-radius:7px;color:#506779;background:#f7fafc;font-size:10px;font-weight:700;cursor:pointer}
    .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#000000f2}.modal.show{display:flex}
    .close{position:absolute;top:max(6px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:3;width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:42px;line-height:1;cursor:pointer}
    .image-viewer{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:10px}.image-viewer.show{display:flex}.image-stage{display:flex;align-items:center;justify-content:center;width:100%;min-height:0;flex:1 1 auto;overflow:hidden}
    #fullImage{display:block;max-width:96vw;max-height:calc(100dvh - 90px);object-fit:contain;transform-origin:center;transition:transform .2s ease}#fullImage.quarter-turn{max-width:calc(100dvh - 90px);max-height:96vw}
    .viewer-tools{display:flex;flex:0 0 auto;gap:8px;padding-bottom:max(2px,env(safe-area-inset-bottom))}.tool-button{min-width:48px;min-height:40px;padding:8px 12px;border:1px solid #ffffff55;border-radius:10px;color:#fff;background:#ffffff20;font-size:15px;font-weight:800;cursor:pointer}
    .comments-viewer,.form-viewer{display:none;width:min(92vw,720px);max-height:88dvh;overflow:auto;padding:18px;border-radius:15px;background:#fff;color:var(--ink)}.comments-viewer.show,.form-viewer.show{display:block}.comments-viewer h2,.form-viewer h2{margin:0 0 12px;font-size:22px}
    .comment{margin-top:8px;padding:10px;border-radius:10px;background:#f2f7fb;font-size:14px}.comment-meta{margin-bottom:4px;color:var(--muted);font-size:12px;font-weight:700}
    .detail-score{font-size:18px;font-weight:900;color:var(--peer)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:var(--muted)}.field input,.field select,.field textarea{width:100%;min-height:42px;padding:9px 10px;border:1px solid #bfd0de;border-radius:9px;background:#fff;color:var(--ink);font:inherit}.field textarea{min-height:70px;resize:vertical}.submit-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.primary,.secondary{min-height:42px;padding:9px 14px;border:0;border-radius:9px;color:#fff;background:#1677d2;font-weight:850;cursor:pointer}.secondary{background:#7656b5}.form-note{margin:0 0 12px;padding:9px;border-radius:8px;background:#edf6ff;color:#315c80;font-size:12px;line-height:1.35}.form-message{min-height:18px;margin-top:8px;font-size:13px;font-weight:700}.form-message.error{color:#b42318}.form-message.success{color:#14804a}
    @media(max-width:640px){.topbar{gap:6px;padding:7px 6px}h1{max-width:52%;font-size:13px;white-space:normal}.actions{gap:4px}.button{min-height:34px;padding:6px 7px;border-radius:8px;font-size:11px}.status{padding:2px 6px;font-size:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:5px;padding:4px 4px 6px}.card{grid-template-rows:minmax(52px,43%) minmax(0,57%);border-radius:9px}.info{padding:4px}.group-name{font-size:13px}.total-button{padding:3px 5px;border-radius:6px;font-size:8px}.product{margin:1px 0 3px;font-size:9px}.scores{gap:3px}.score-item{padding:3px 1px;border-radius:5px;font-size:8px}.score-item b{margin-top:1px;font-size:11px}.comments-button{margin-top:3px;padding:2px 5px;font-size:8px}.empty{font-size:11px}.tool-button{min-width:43px;padding:7px 9px;font-size:13px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.submit-row{align-items:stretch;flex-direction:column}.primary,.secondary{width:100%}}
    @media(max-height:620px){.product{display:none}.comments-button{margin-top:2px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>TỔNG HỢP ĐÁNH GIÁ SẢN PHẨM NHÓM</h1>
      <nav class="actions" aria-label="Thao tác">
        <a class="button photo" href="https://docs.google.com/forms/d/e/1FAIpQLSfCxfr6o_anyQH-GuJynQB8LQO9zdh2cB06GUTB7u2U6tr-xg/viewform" target="_blank" rel="noopener">GỬI ẢNH</a>
        <button id="openScoreForm" class="button score" type="button">CHẤM ĐIỂM</button>
      </nav>
    </header>
    <div id="status" class="status">Đang tải dữ liệu…</div>
    <main id="grid" class="grid" aria-live="polite"></main>
  </div>
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <button id="closeModal" class="close" aria-label="Đóng">×</button>
    <div id="imageViewer" class="image-viewer">
      <div class="image-stage"><img id="fullImage" alt="Ảnh sản phẩm phóng to"></div>
      <div class="viewer-tools">
        <button id="rotateLeft" class="tool-button" type="button">↶ Xoay trái</button>
        <button id="resetRotation" class="tool-button" type="button">Đặt lại</button>
        <button id="rotateRight" class="tool-button" type="button">Xoay phải ↷</button>
      </div>
    </div>
    <section id="commentsViewer" class="comments-viewer" aria-label="Nhận xét"></section>
    <section id="formViewer" class="form-viewer" aria-label="Chấm điểm"></section>
  </div>
  <script>
    const SHEET_ID='1Ga7dLZHSaSkYFB8FDvCfvvZ0QMYe3hwLZo_sjT0Rkys';
    const API_URL='https://script.google.com/macros/s/AKfycbzLcPTUoKneqrLyrFWMHbRAgS-Y_Cyx0ziMcYe9cTgn9DpyS58MYyS3to6N3cknjVQFIg/exec';
    const GROUP_NAMES=['Nhóm 1','Nhóm 2','Nhóm 3','Nhóm 4','Nhóm 5','Nhóm 6'];
    const SHEETS={
      summary:{name:'Tổng hợp',range:'A5:B10',callback:'receiveSummary'},
      photos:{name:'Ảnh sản phẩm',range:'D2:D7',callback:'receivePhotos'},
      scores:{name:'Dữ liệu chấm',range:'A2:G500',callback:'receiveScores'}
    };
    let summaryRows=GROUP_NAMES.map(name=>[name,'']),photoUrls=Array(6).fill(''),scoreRows=[],scoreData={},pending=0,rotation=0;
    function displayValue(cell){if(!cell)return'';if(cell.f!==undefined&&cell.f!==null)return String(cell.f);if(cell.v!==undefined&&cell.v!==null)return String(cell.v);return''}
    function allRows(response){const rows=response?.table?.rows||[],width=response?.table?.cols?.length||0;return rows.map(row=>Array.from({length:width},(_,i)=>displayValue(row?.c?.[i])))}
    function fixedRows(response,count,width){const rows=allRows(response);return Array.from({length:count},(_,r)=>Array.from({length:width},(_,c)=>rows[r]?.[c]||''))}
    window.receiveSummary=response=>{summaryRows=fixedRows(response,6,2);GROUP_NAMES.forEach((name,i)=>{if(!summaryRows[i][0])summaryRows[i][0]=name});finishRequest()};
    window.receivePhotos=response=>{photoUrls=fixedRows(response,6,1).map(row=>row[0]||'');finishRequest()};
    window.receiveScores=response=>{scoreRows=allRows(response);calculateScores();finishRequest()};
    function normalizeGroup(value){const text=String(value||'').trim().toLowerCase().replace(/\s+/g,' '),number=text.match(/(?:nhóm|nhom)\s*(\d+)/)?.[1];return number?'Nhóm '+number:String(value||'').trim()}
    function scoreNumber(value){const number=Number(String(value||'').replace(',','.'));return Number.isFinite(number)?number:null}
    function average(values){const valid=values.filter(v=>v!==null);return valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:null}
    function classifyScore(evaluator,target,storedType){const type=String(storedType||'').toLowerCase();if(type.includes('giáo viên')||type.includes('giao vien'))return'teacher';if(type.includes('tự chấm')||type.includes('tu cham'))return'self';if(type.includes('chéo')||type.includes('cheo'))return'peer';if(String(evaluator).toLowerCase().includes('giáo viên'))return'teacher';return normalizeGroup(evaluator)===normalizeGroup(target)?'self':'peer'}
    function calculateScores(){
      const result={};GROUP_NAMES.forEach(group=>{result[group]={entries:new Map(),selfValues:[],peerValues:[],teacherValues:[],peerDetails:[],comments:[]}});
      scoreRows.forEach(row=>{const evaluator=row[1]||'',target=normalizeGroup(row[2]),storedType=row[3]||'',score=scoreNumber(row[4]),comment=row[5]||'',status=String(row[6]||'').toLowerCase();if(!result[target]||score===null||status.includes('thu hồi')||status.includes('het hieu luc')||status.includes('hết hiệu lực'))return;const kind=classifyScore(evaluator,target,storedType),normalizedEvaluator=kind==='teacher'?'Giáo viên':normalizeGroup(evaluator),key=kind+'|'+normalizedEvaluator;result[target].entries.set(key,{evaluator:evaluator||'Không ghi tên',target,kind,score,comment:comment.trim()})});
      GROUP_NAMES.forEach(group=>{const item=result[group];item.entries.forEach(entry=>{item[entry.kind+'Values'].push(entry.score);if(entry.kind==='peer')item.peerDetails.push(entry);if(entry.comment)item.comments.push({evaluator:entry.evaluator,type:entry.kind,text:entry.comment,score:entry.score})});delete item.entries;item.self=average(item.selfValues);item.peer=average(item.peerValues);item.teacher=average(item.teacherValues);item.peerCount=item.peerValues.length;item.requiredPeerCount=GROUP_NAMES.length-1;item.complete=item.self!==null&&item.teacher!==null&&item.peerCount>=item.requiredPeerCount;item.total=item.complete?item.self*.2+item.peer*.3+item.teacher*.5:null});scoreData=result
    }
    function finishRequest(){pending=Math.max(0,pending-1);render();if(pending===0){const time=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});setStatus('Đã cập nhật lúc '+time,false)}}
    function loadSheet(config,key){document.getElementById('jsonp-'+key)?.remove();const script=document.createElement('script');script.id='jsonp-'+key;script.async=true;script.onerror=()=>{pending=Math.max(0,pending-1);setStatus('Không đọc được Google Sheet. Kiểm tra quyền “Bất kỳ ai có đường liên kết – Người xem”.',true)};const params=new URLSearchParams({tqx:'out:json;responseHandler:'+config.callback,sheet:config.name,range:config.range,_:Date.now().toString()});script.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?'+params.toString();document.head.appendChild(script)}
    function refreshData(){pending=3;loadSheet(SHEETS.summary,'summary');loadSheet(SHEETS.photos,'photos');loadSheet(SHEETS.scores,'scores')}
    function driveFileId(url){const value=String(url||''),idParam=value.match(/[?&]id=([^&]+)/);if(idParam)return idParam[1];const pathId=value.match(/\/d\/([a-zA-Z0-9_-]{20,})/);if(pathId)return pathId[1];const looseId=value.match(/[a-zA-Z0-9_-]{25,}/);return looseId?looseId[0]:''}
    function imageUrl(url){const id=driveFileId(url);return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1600':url}
    function safeText(value,fallback='—'){return value===undefined||value===null||value===''?fallback:String(value)}
    function formatScore(value){return value===null||value===undefined?'—':value.toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function scoreItem(label,value,className,onClick){const item=document.createElement(onClick?'button':'div');if(onClick)item.type='button';item.className='score-item '+className;const text=document.createElement('span');text.className='score-label';text.textContent=label+(onClick?' ⓘ':'');const strong=document.createElement('b');strong.textContent=formatScore(value);item.append(text,strong);if(onClick)item.addEventListener('click',onClick);return item}
    function render(){
      const grid=document.getElementById('grid');grid.replaceChildren();
      GROUP_NAMES.forEach((defaultName,i)=>{const row=summaryRows[i]||[],data=scoreData[defaultName]||{self:null,peer:null,teacher:null,total:null,comments:[]},card=document.createElement('article');card.className='card';
        const photoBox=document.createElement('div');photoBox.className='photo-box';if(photoUrls[i]){photoBox.classList.add('has-image');const image=document.createElement('img');image.src=imageUrl(photoUrls[i]);image.alt='Sản phẩm của '+safeText(row[0],defaultName);image.loading='eager';image.referrerPolicy='no-referrer';image.addEventListener('click',()=>openImage(image.src,image.alt));photoBox.appendChild(image)}else{const empty=document.createElement('div');empty.className='empty';empty.textContent='CHƯA GỬI ẢNH';photoBox.appendChild(empty)}
        const info=document.createElement('div');info.className='info';const nameRow=document.createElement('div');nameRow.className='name-row';const name=document.createElement('div');name.className='group-name';name.textContent=safeText(row[0],defaultName);nameRow.appendChild(name);if(data.complete){const total=document.createElement('button');total.type='button';total.className='total-button';total.textContent='TỔNG: '+formatScore(data.total);total.title='Xem tổng hợp điểm '+defaultName;total.addEventListener('click',()=>openTotalSummary(defaultName,data));nameRow.appendChild(total)}
        const product=document.createElement('div');product.className='product';product.textContent=safeText(row[1],'Chưa cập nhật tên sản phẩm');const scores=document.createElement('div');scores.className='scores';const peerProgress=(data.peerCount||0)+'/'+(data.requiredPeerCount||5);scores.append(scoreItem('Tự chấm',data.self,'score-self'),scoreItem('Chấm chéo '+peerProgress,data.peer,'score-peer',()=>openPeerDetails(defaultName,data.peerDetails||[])),scoreItem('GV chấm',data.teacher,'score-teacher'));info.append(nameRow,product,scores);
        if(data.comments.length){const comments=document.createElement('button');comments.type='button';comments.className='comments-button';comments.textContent='💬 '+data.comments.length+' nhận xét';comments.addEventListener('click',()=>openComments(defaultName,data.comments));info.appendChild(comments)}
        card.append(photoBox,info);grid.appendChild(card)
      })
    }
    function setStatus(message,isError){const status=document.getElementById('status');status.textContent=message;status.classList.toggle('error',Boolean(isError))}
    function openModal(fullscreen=false){const modal=document.getElementById('modal');modal.classList.add('show');document.body.style.overflow='hidden';if(fullscreen&&modal.requestFullscreen&&!document.fullscreenElement)modal.requestFullscreen().catch(()=>{})}
    function hideViewers(){document.getElementById('imageViewer').classList.remove('show');document.getElementById('commentsViewer').classList.remove('show');document.getElementById('formViewer').classList.remove('show')}
    function openImage(src,alt){rotation=0;hideViewers();const imageViewer=document.getElementById('imageViewer'),fullImage=document.getElementById('fullImage');imageViewer.classList.add('show');fullImage.src=src;fullImage.alt=alt||'Ảnh sản phẩm phóng to';applyRotation();openModal(true)}
    function typeName(type){return type==='self'?'Tự chấm':type==='teacher'?'Giáo viên':'Chấm chéo'}
    function openComments(group,comments){hideViewers();const viewer=document.getElementById('commentsViewer');viewer.classList.add('show');viewer.replaceChildren();const heading=document.createElement('h2');heading.textContent='Nhận xét – '+group;viewer.appendChild(heading);comments.forEach(item=>{const box=document.createElement('div');box.className='comment';const meta=document.createElement('div');meta.className='comment-meta';meta.textContent=item.evaluator+' • '+typeName(item.type)+' • '+formatScore(item.score)+' điểm';const text=document.createElement('div');text.textContent=item.text;box.append(meta,text);viewer.appendChild(box)});openModal()}
    function openPeerDetails(group,details){hideViewers();const viewer=document.getElementById('commentsViewer');viewer.classList.add('show');viewer.replaceChildren();const heading=document.createElement('h2');heading.textContent='Chi tiết chấm chéo – '+group;viewer.appendChild(heading);if(!details.length){const empty=document.createElement('div');empty.className='comment';empty.textContent='Chưa có nhóm nào chấm chéo.';viewer.appendChild(empty)}details.forEach(item=>{const box=document.createElement('div');box.className='comment';const line=document.createElement('div');line.className='detail-score';line.textContent=item.evaluator+' chấm '+item.target+': '+formatScore(item.score)+' điểm';box.appendChild(line);if(item.comment){const text=document.createElement('div');text.textContent='Nhận xét: '+item.comment;box.appendChild(text)}viewer.appendChild(box)});openModal()}
    function openTotalSummary(group,data){hideViewers();const viewer=document.getElementById('commentsViewer');viewer.classList.add('show');viewer.replaceChildren();const heading=document.createElement('h2');heading.textContent='TỔNG HỢP ĐIỂM – '+group;viewer.appendChild(heading);[['Tự chấm × 20%',data.self],['Chấm chéo ('+data.peerCount+'/'+data.requiredPeerCount+') × 30%',data.peer],['Giáo viên × 50%',data.teacher]].forEach(row=>{const box=document.createElement('div');box.className='comment';box.textContent=row[0]+': '+formatScore(row[1])+' điểm';viewer.appendChild(box)});const total=document.createElement('div');total.className='comment detail-score';total.textContent='ĐIỂM TỔNG HỢP: '+formatScore(data.total);viewer.appendChild(total);openModal()}
    function apiReady(){return /^https:\/\/script\.google\.com\/macros\/s\//.test(API_URL)}
    function groupOptions(includeTeacher=false){return GROUP_NAMES.map(name=>'<option value="'+name+'">'+name+'</option>').join('')+(includeTeacher?'<option value="Giáo viên">Giáo viên</option>':'')}
    function openScoreForm(){hideViewers();const viewer=document.getElementById('formViewer');viewer.classList.add('show');viewer.innerHTML='<h2>Chấm điểm sản phẩm</h2><p class="form-note">Mỗi nhóm chỉ được chấm một lần cho chính mình và một lần cho từng nhóm khác. Mã PIN dùng để xác nhận đúng nhóm chấm.</p><form id="scoreForm" class="form-grid"><div class="field"><label>Người chấm</label><select name="evaluator" required>'+groupOptions(true)+'</select></div><div class="field"><label>Nhóm được chấm</label><select name="target" required>'+groupOptions(false)+'</select></div><div class="field"><label>Điểm (0–10)</label><input name="score" type="number" min="0" max="10" step="0.25" required></div><div class="field"><label>Mã PIN của nhóm</label><input name="pin" type="password" inputmode="numeric" autocomplete="off" required></div><div class="field full"><label>Nhận xét</label><textarea name="comment" maxlength="500" placeholder="Nhận xét ngắn gọn..."></textarea></div><div class="field full"><div class="submit-row"><button class="secondary" id="openReset" type="button">GV: Cấp lại quyền chấm</button><button class="primary" type="submit">GỬI ĐIỂM</button></div><div id="formMessage" class="form-message"></div></div></form>';viewer.querySelector('#scoreForm').addEventListener('submit',submitScore);viewer.querySelector('#openReset').addEventListener('click',openResetForm);if(!apiReady())showFormMessage('Chưa cấu hình API_URL trong index.html. Giáo viên làm theo README trước khi sử dụng.',true);openModal()}
    function openResetForm(){const viewer=document.getElementById('formViewer');viewer.innerHTML='<h2>Cấp lại quyền chấm</h2><p class="form-note">Thao tác này thu hồi lượt chấm cũ của đúng cặp bên dưới. Sau đó người chấm được phép gửi lại một lần.</p><form id="resetForm" class="form-grid"><div class="field"><label>Người được chấm lại</label><select name="evaluator" required>'+groupOptions(true)+'</select></div><div class="field"><label>Nhóm được chấm</label><select name="target" required>'+groupOptions(false)+'</select></div><div class="field full"><label>Mã quản trị giáo viên</label><input name="teacherPin" type="password" autocomplete="off" required></div><div class="field full"><div class="submit-row"><button class="secondary" id="backScore" type="button">Quay lại</button><button class="primary" type="submit">CẤP LẠI QUYỀN</button></div><div id="formMessage" class="form-message"></div></div></form>';viewer.querySelector('#resetForm').addEventListener('submit',resetPermission);viewer.querySelector('#backScore').addEventListener('click',openScoreForm);if(!apiReady())showFormMessage('Chưa cấu hình API_URL trong index.html.',true)}
    function showFormMessage(message,isError=false){const box=document.getElementById('formMessage');if(!box)return;box.textContent=message;box.className='form-message '+(isError?'error':'success')}
    async function postApi(payload){if(!apiReady())throw new Error('Chưa cấu hình địa chỉ Google Apps Script.');const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});const data=await response.json();if(!data.ok)throw new Error(data.message||'Không thể thực hiện.');return data}
    async function submitScore(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),values=Object.fromEntries(new FormData(form));button.disabled=true;showFormMessage('Đang kiểm tra và lưu điểm...');try{const data=await postApi({action:'submitScore',...values});showFormMessage(data.message||'Đã lưu điểm.');form.reset();setTimeout(refreshData,1000)}catch(error){showFormMessage(error.message,true)}finally{button.disabled=false}}
    async function resetPermission(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),values=Object.fromEntries(new FormData(form));button.disabled=true;showFormMessage('Đang cấp lại quyền...');try{const data=await postApi({action:'resetPermission',...values});showFormMessage(data.message||'Đã cấp lại quyền chấm.')}catch(error){showFormMessage(error.message,true)}finally{button.disabled=false}}
    function applyRotation(){const image=document.getElementById('fullImage'),normalized=((rotation%360)+360)%360;image.style.transform='rotate('+rotation+'deg)';image.classList.toggle('quarter-turn',normalized===90||normalized===270)}
    function rotateImage(degrees){rotation+=degrees;applyRotation()}
    function closeModal(){document.getElementById('modal').classList.remove('show');hideViewers();document.body.style.overflow='';if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}
    document.getElementById('openScoreForm').addEventListener('click',openScoreForm);document.getElementById('rotateLeft').addEventListener('click',()=>rotateImage(-90));document.getElementById('rotateRight').addEventListener('click',()=>rotateImage(90));document.getElementById('resetRotation').addEventListener('click',()=>{rotation=0;applyRotation()});document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('modal').addEventListener('click',event=>{if(event.target.id==='modal')closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();if(event.key==='ArrowLeft'&&document.getElementById('imageViewer').classList.contains('show'))rotateImage(-90);if(event.key==='ArrowRight'&&document.getElementById('imageViewer').classList.contains('show'))rotateImage(90)});
    calculateScores();render();refreshData();setInterval(refreshData,5000);
  </script>
</body>
