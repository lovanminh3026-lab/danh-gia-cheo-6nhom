<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7fbff">
  <title>Đánh giá sản phẩm nhóm</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-copy">
      <p class="eyebrow">HOẠT ĐỘNG NHÓM</p>
      <h1>Đánh giá sản phẩm nhóm</h1>
      <p class="subtitle">Tự đánh giá · Đánh giá chéo · Giáo viên đánh giá</p>
    </div>
    <div class="actions" aria-label="Thao tác chính">
      <button class="action upload" data-form="photo">Gửi ảnh</button>
      <button class="action score" data-form="score">Chấm điểm</button>
    </div>
  </header>

  <main>
    <section class="summary-bar" aria-label="Cách tính điểm">
      <span><b>20%</b> Tự chấm</span>
      <span><b>30%</b> Chấm chéo</span>
      <span><b>50%</b> Giáo viên</span>
      <span id="syncStatus" class="sync">Đang tải dữ liệu…</span>
    </section>

    <section id="groupGrid" class="grid" aria-live="polite"></section>
  </main>

  <div id="formModal" class="modal" aria-hidden="true">
    <div class="modal-panel form-panel">
      <div class="modal-head">
        <strong id="formTitle">Biểu mẫu</strong>
        <button class="close" data-close aria-label="Đóng">×</button>
      </div>
      <iframe id="formFrame" title="Biểu mẫu nhập liệu" loading="lazy"></iframe>
    </div>
  </div>

  <div id="imageModal" class="modal image-modal" aria-hidden="true">
    <button class="close image-close" data-close-image aria-label="Đóng ảnh">×</button>
    <img id="fullImage" alt="Ảnh sản phẩm phóng to">
  </div>

  <noscript>Vui lòng bật JavaScript để sử dụng trang đánh giá.</noscript>
  <script src="app.js"></script>
</body>
</html>
